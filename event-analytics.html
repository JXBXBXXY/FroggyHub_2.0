<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Аналитика события</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="fh-bg background-layer" aria-hidden="true"></div>
  <div class="fh-bubbles bg-bubbles" aria-hidden="true"></div>

  <nav class="topbar">
    <div class="inner">
      <div class="topbar-left">
        <a href="/" class="logo" data-route="home">FroggyHub</a>
      </div>
      <div class="topbar-right">
        <a class="btn btn-sm btn-ghost" href="/" data-route="home">Меню</a>
        <button class="btn btn-sm btn-ghost" type="button" data-route="profile" data-href="/profile.html">Профиль</button>
        <button class="btn btn-sm btn-ghost" type="button" data-route="settings">Настройки</button>
      </div>
    </div>
  </nav>

  <main class="fh-content">
    <div class="container" role="main">
      <div class="card" id="eventHead">
        <div class="hero">
          <div class="hero-text">
            <h1 id="eventTitle">Событие</h1>
            <div class="chips">
              <span class="chip" id="eventDate">—</span>
              <span class="chip" id="eventTime">—</span>
              <span class="chip" id="eventAddr">—</span>
            </div>
          </div>
        </div>
        <div class="bar-actions">
          <button class="btn btn--ghost btn--sm" id="backBtn" aria-label="Назад в меню" type="button">Вернуться в меню</button>
          <button class="btn btn--primary btn--sm" id="editEventBtn" aria-label="Редактировать событие" type="button">Изменить</button>
        </div>
      </div>

      <section class="card" id="visitorsBlock" aria-labelledby="visitorsTitle">
        <h2 id="visitorsTitle">Посетители</h2>
        <div class="stats">
          <span class="badge yes" id="rsvpYesCount">0</span>
          <span class="badge maybe" id="rsvpMaybeCount">0</span>
          <span class="badge no" id="rsvpNoCount">0</span>
        </div>
        <div class="progress" id="rsvpProgress" aria-hidden="true">
          <div class="yes" id="rsvpYesBar"></div>
          <div class="maybe" id="rsvpMaybeBar"></div>
          <div class="no" id="rsvpNoBar"></div>
        </div>
        <ul id="visitorsList" class="ea-list" role="list" aria-describedby="visitorsHint"></ul>
        <p id="visitorsHint" class="hint">Статусы: 🟢 Иду, 🟡 Возможно, 🔴 Не иду</p>
      </section>

      <section class="card" id="wishlistBlock" aria-labelledby="wishlistTitle">
        <h2 id="wishlistTitle">Wishlist</h2>
        <div class="stats">
          <span class="badge free" id="giftFreeCount">0</span>
          <span class="badge taken" id="giftTakenCount">0</span>
        </div>
        <div class="progress" id="giftProgress" aria-hidden="true">
          <div class="free" id="giftFreeBar"></div>
          <div class="taken" id="giftTakenBar"></div>
        </div>
        <ul id="wishlistList" class="wl-list" role="list" aria-describedby="wishlistHint"></ul>
        <p id="wishlistHint" class="hint">🟢 свободно, 🔒 занято</p>
      </section>

      <p id="error" class="error" role="status" aria-live="polite"></p>
    </div>
  </main>

  <div id="cookieCard" class="card" style="display:none">
    <svg id="cookieSvg" viewBox="0 0 24 24" aria-hidden="true">
      <g><path d="M12 2a5 5 0 0 0 5 5 5 5 0 0 0 5 5 10 10 0 1 1-10-10z"/></g>
    </svg>
    <div class="cookieHeading">Cookies</div>
    <div class="cookieDescription">
      Мы используем файлы cookies, чтобы сайт работал быстрее и удобнее. Продолжая, вы соглашаетесь с их использованием.
    </div>
    <div class="buttonContainer">
      <button class="btn btn--primary acceptButton" id="cookieAccept" type="button">Ок</button>
      <button class="btn btn--ghost declineButton" id="cookieDecline" type="button">Только необходимые</button>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
