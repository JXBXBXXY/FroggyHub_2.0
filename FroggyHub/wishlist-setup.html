<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Wishlist события</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="authed">
  <header class="topbar">
    <button data-link="menu" class="btn">Меню</button>
    <button data-action="logout" class="btn">Выйти</button>
  </header>

  <main class="container">
    <div class="card">
      <h1>Wishlist</h1>

      <div class="row">
        <input id="giftInput" type="text" placeholder="Например: Пицца, Кола, Настолка" />
        <button id="giftAdd" class="btn btn-primary">Добавить</button>
      </div>

      <p>
        <span>🟢 свободно: <b id="giftFreeCount">0</b></span>
        &nbsp;&nbsp;
        <span>🔒 занято: <b id="giftTakenCount">0</b></span>
      </p>

      <ul id="giftList" class="list"></ul>

      <div class="actions">
        <button id="giftNext" class="btn btn-success">Дальше → Итоги</button>
      </div>
    </div>
  </main>

  <div id="toast" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
