<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wishlist для события</title>
<link rel="stylesheet" href="/style.css?v=glass-18">
</head>
<body class="guest">
<header class="topbar">
  <a class="logo fh-logo" data-link="home">FroggyHub</a>
  <div class="topbar-right">
    <button class="btn" data-link="menu">Меню</button>
    <button class="btn" data-link="profile">Профиль</button>
    <button class="btn" data-link="settings">Настройки</button>
    <button class="btn" data-action="logout">Выйти</button>
  </div>
</header>
  <div id="fh-message-clouds" aria-hidden="true"></div>

  <main class="container" role="main">
    <div class="card">
      <h1>Вишлист</h1>
      <div id="wlGrid" class="wl-grid"></div>
      <div class="bar-actions" style="margin-top:1.5rem;">
        <button class="btn" id="giftAdd">Добавить</button>
        <span style="flex:1"></span>
        <button class="btn btn--ghost" id="giftSkip">Пропустить</button>
        <button class="btn btn--primary" id="giftNext">Далее</button>
      </div>
    </div>
  </main>

  <div id="giftModal" class="modal" hidden>
    <div class="modal-card">
      <h2>Новый предмет</h2>
      <label>Название предмета
        <input id="giftName" required />
      </label>
      <label>Ссылка
        <input id="giftUrl" />
      </label>
      <div class="actions">
        <button class="btn btn--primary" id="giftSave">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Public env -->
  <script src="env.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
