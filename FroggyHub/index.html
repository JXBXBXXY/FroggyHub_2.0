<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FroggyHub</title>
  <link rel="stylesheet" href="style.css?v=glass-18">
</head>
<body class="guest bg-frog">
<header class="topbar">
  <a class="logo fh-logo" data-link="home">FroggyHub</a>
  <div class="topbar-right">
    <button class="btn" data-link="menu">Меню</button>
    <button class="btn" data-link="profile">Профиль</button>
    <button class="btn" data-link="settings">Настройки</button>
    <button class="btn" data-action="logout">Выйти</button>
  </div>
</header>
  <!-- фоновые сообщения -->
  <div id="fh-message-clouds" aria-hidden="true"></div>

  <main class="hero">
    <div class="hero-box">
      <button class="btn btn-large" data-link="event-edit">Создать событие</button>
      <div class="join-block">
        <input type="text" id="join-code" placeholder="Код события" />
        <button class="btn btn-large" data-action="join">Присоединиться</button>
      </div>
    </div>
  </main>

  <!-- остальной код страницы, скрипты и т.д. оставь как есть -->

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Public env -->
  <script src="env.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
