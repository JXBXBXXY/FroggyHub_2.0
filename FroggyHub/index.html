<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FroggyHub</title>

  <!-- общий стиль проекта -->
  <link rel="stylesheet" href="./style.css" />

  <!-- ENV: на Netlify сниппет/скриптом прокинь window.ENV -->
  <script>
    window.ENV = window.ENV || {
      PUBLIC_SUPABASE_URL: "PUBLIC_SUPABASE_URL",
      PUBLIC_SUPABASE_ANON_KEY: "PUBLIC_SUPABASE_ANON_KEY",
    };
  </script>
</head>
<body class="guest">
  <!-- Топбар -->
  <header class="topbar">
    <a class="brand" data-link="home">FroggyHub</a>
    <nav>
      <button class="nav-btn guest-only" data-open-auth>Войти</button>
      <button class="nav-chip authed-only" data-link="menu">Меню</button>
      <button class="nav-chip authed-only" data-link="profile">Профиль</button>
      <button class="nav-chip authed-only" id="btn-logout">Выйти</button>
    </nav>
  </header>

  <main class="screen" id="screen-index">
    <!-- здесь может быть landing/промо; для гостя показываем auth-карту -->
    <section class="auth-card-wrap guest-only" id="auth-overlay" aria-labelledby="auth-title">
      <div class="card auth-card">
        <h2 id="auth-title">Вход / Регистрация</h2>
        <div class="tabs">
          <button class="tab is-active" data-auth-tab="login">Вход</button>
          <button class="tab" data-auth-tab="signup">Регистрация</button>
          <button class="tab" data-auth-tab="reset">Сброс</button>
        </div>

        <!-- Вход -->
        <form class="auth-pane visible" data-pane="login" id="form-login">
          <label> Email или ник
            <input name="login" autocomplete="username" required />
          </label>
          <label> Пароль
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn btn--primary">Войти</button>
        </form>

        <!-- Регистрация -->
        <form class="auth-pane" data-pane="signup" id="form-signup">
          <label> Никнейм
            <input name="nickname" autocomplete="nickname" required />
          </label>
          <label> Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label> Пароль
            <input name="password" type="password" autocomplete="new-password" required />
          </label>
          <button type="submit" class="btn btn--primary">Создать аккаунт</button>
        </form>

        <!-- Сброс пароля -->
        <form class="auth-pane" data-pane="reset" id="form-reset">
          <label> Email
            <input name="email" type="email" required />
          </label>
          <button type="submit" class="btn">Отправить ссылку</button>
        </form>

        <p id="auth-error" class="error" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- Блок меню для авторизованных (пример) -->
    <section class="panel authed-only" id="lobby-shortcuts">
      <div class="actions">
        <button class="btn btn--primary" data-link="lobby">Открыть лобби</button>
      </div>
    </section>
  </main>

  <!-- Фоновые «смски» — контейнер создаёт JS; держим место для SSR-дефолта -->
  <div id="fh-message-clouds" aria-hidden="true"></div>

  <!-- единый модуль приложения (сам подгрузит Supabase CDN при необходимости) -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
