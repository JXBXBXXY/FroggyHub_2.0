<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- базовый viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>FroggyHub — события и вишлисты</title>

  <!-- базовые стили -->
  <link rel="stylesheet" href="style.css">

  <!-- иконка -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">

  <!-- iOS safe-area + запрет авто-линков телефонов (оставляю как есть) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">

  <!-- ДОБАВЛЕНО: системные подсказки ОС/браузеру -->
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b241b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- ДОБАВЛЕНО: подсказки загрузчику -->
  <link rel="preload" as="image" href="/assets/frog_idle.png" imagesrcset="/assets/frog_idle.png 1x" imagesizes="(max-width:640px) 60vw, 520px">
  <link rel="preload" as="image" href="/assets/stump.png" imagesrcset="/assets/stump.png 1x" imagesizes="(max-width:640px) 60vw, 220px">
  <link rel="dns-prefetch" href="//supabase.co">
  <link rel="dns-prefetch" href="//supabase.net">

  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat;}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding-inline:1rem;}
    /* ДОБАВЛЕНО: корректный 100vh на iOS/Android с адресной строкой */
    .fh-content{min-height:calc(var(--vh, 1vh) * 100);}
    .screen[hidden]{display:none !important;}

    #fh-message-clouds{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
    .fh-bubble{position:absolute;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);backdrop-filter:saturate(150%) blur(6px);-webkit-backdrop-filter:saturate(150%) blur(6px);
      color:rgba(255,255,255,.88);font-size:14px;line-height:1.25;box-shadow:0 8px 20px rgba(0,0,0,.25);
      opacity:0;transform:translate3d(0,0,0) scale(1);transition:opacity .35s ease, transform .35s ease}
    .fh-bubble--in{opacity:1}.fh-bubble--out{opacity:0;transform:translate3d(0,6px,0) scale(.98)}
    @media (max-width:640px){.fh-bubble{font-size:12px}}
  </style>
</head>

<body class="scene-intro" data-page="index">
  <div id="fh-message-clouds" class="fh-bubbles" aria-hidden="true"></div>

  <div class="fh-content">
    <nav class="topbar" role="navigation" aria-label="Главная навигация">
      <div class="topbar-left">
        <a href="/" id="logo" class="logo" data-link="home">FroggyHub</a>
      </div>
      <div class="topbar-right">
        <button id="nav-menu" class="btn btn-sm btn-ghost" data-link="home" hidden>Меню</button>
        <a id="nav-profile" class="btn btn-sm btn-ghost" href="/profile.html">Профиль</a>
        <button id="nav-settings" class="btn btn-sm btn-ghost" data-link="settings" data-role="settings">Настройки</button>
      </div>
    </nav>

    <section id="screen-auth" class="screen container" role="main" hidden>
      <div class="card auth-card auth-panel" id="authPanel" style="max-width:620px;margin:40px auto">
        <div class="auth-head">
          <div class="auth-avatar">
            <!-- ДОБАВЛЕНО: width/height + lazy для CLS/производительности -->
            <img src="/assets/frog_idle.png" alt="Froggy" width="56" height="56" loading="lazy" decoding="async" />
          </div>
          <div class="auth-title">
            <h2>Вход / Регистрация</h2>
            <div class="auth-steps">
              <span class="chip chip-on" data-step="1">Шаг 1</span>
              <span class="chip" data-step="profile">Профиль</span>
            </div>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Auth">
          <button id="tab-login" class="tab is-active" role="tab" aria-controls="pane-login" aria-selected="true">Войти</button>
          <button id="tab-register" class="tab" role="tab" aria-controls="pane-register" aria-selected="false">Регистрация</button>
        </div>

        <!-- Вход -->
        <section id="pane-login" class="pane" role="tabpanel" aria-labelledby="tab-login">
          <form id="loginForm" class="grid" novalidate autocomplete="off">
            <label>E-mail
              <input id="login-email" name="email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="username">
            </label>
            <div class="hint">или введите никнейм ниже (для старых аккаунтов)</div>
            <label>Никнейм
              <input id="login-nickname" name="nickname" type="text" placeholder="Никнейм" autocomplete="nickname">
            </label>
            <label>Пароль
              <input id="login-password" name="password" type="password" placeholder="••••••••" minlength="4" required autocomplete="current-password">
            </label>
            <button id="login-btn" class="btn btn-primary btn-xl w-100" type="submit">Войти</button>
            <div id="login-status" class="error" aria-live="polite" style="margin-top:.5rem"></div>
          </form>
        </section>

        <!-- Регистрация -->
        <section id="pane-register" class="pane is-hidden" role="tabpanel" aria-labelledby="tab-register">
          <form id="signupForm" class="grid" novalidate autocomplete="off">
            <label>E-mail <small>(обязательно)</small>
              <input id="signup-email" name="email" type="email" required inputmode="email" placeholder="you@example.com" autocomplete="email">
            </label>
            <label>Имя / Никнейм <small>(отобразится в приложении)</small>
              <input id="signup-nickname" name="nickname" required minlength="2" autocomplete="nickname" placeholder="Ваш ник">
            </label>
            <label>Пароль
              <input id="signup-password" name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="Минимум 6 символов">
            </label>
            <label>Повтор пароля
              <input id="signup-password2" name="password2" type="password" required minlength="6" autocomplete="new-password" placeholder="Ещё раз пароль">
            </label>
            <button id="signup-btn" class="btn btn-primary btn-xl w-100" type="submit">Зарегистрироваться</button>
            <div id="reg-status" class="error" aria-live="polite" style="margin-top:.5rem"></div>
          </form>
        </section>
      </div>
    </section>

    <!-- Домашний экран -->
    <section id="screen-home" class="screen visible" role="main">
      <div class="menu-deck" id="menuDeck" data-onb="deck">
        <div class="panel">
          <div class="menu-grid">
            <button id="create-event" class="btn btn-primary" data-go="app" data-mode="create" data-onb="create">
              Создать событие
            </button>

            <form id="join-form" class="join-row" action="/join.html" method="GET" autocomplete="off" novalidate data-onb="join">
              <input
                id="join-code"
                class="input"
                name="code"
                inputmode="text"
                maxlength="6"
                placeholder="Введите 6-значный код"
                pattern="[A-Za-z0-9]{6}"
                aria-label="Код приглашения из 6 символов"
                title="6 символов: буквы или цифры">
              <button id="join-btn" type="submit" class="btn">Дальше</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Коучмарки и тосты -->
  <div id="coachLayer" aria-live="polite" aria-atomic="true"></div>
  <div id="toastLayer" aria-live="polite" aria-atomic="true"></div>

  <!-- noscript: сообщение пользователю -->
  <noscript>
    <div class="panel" style="max-width:720px;margin:16px auto">
      Для работы FroggyHub требуется включённый JavaScript.
    </div>
  </noscript>

  <!-- нормализация кода перед отправкой -->
  <script>
    (function () {
      const form = document.getElementById('join-form');
      const input = document.getElementById('join-code');
      if (!form || !input) return;
      input.addEventListener('input', () => {
        const v = input.value.replace(/\s+/g,'').slice(0,6);
        input.value = v.toUpperCase();
      });
      form.addEventListener('submit', (e) => {
        const code = (input.value || '').trim().toUpperCase();
        if (!/^[A-Z0-9]{6}$/.test(code)) {
          e.preventDefault();
          input.focus(); input.select();
        } else {
          input.value = code;
          try {
            sessionStorage.removeItem('fh:draftEvent');
            sessionStorage.removeItem('fh:rsvpDone');
          } catch {}
        }
      });
    })();
  </script>

  <!-- модульное приложение -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
