<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FroggyHub</title>
  <link rel="stylesheet" href="./style.css?v=ui7">
</head>
<body class="guest bg-frog">
  <!-- фоновые сообщения -->
  <div id="fh-message-clouds" aria-hidden="true"></div>

  <!-- TOPBAR -->
  <header class="topbar" data-auth-only>
    <a class="logo fh-logo" data-link="home">FroggyHub</a>
    <div class="topbar-right">
      <button class="btn" data-link="menu">Меню</button>
      <button class="btn" data-link="profile">Профиль</button>
      <button class="btn" data-action="logout">Выйти</button>
    </div>
  </header>

  <!-- HERO на главной -->
  <main id="home" class="home-screen">
    <section class="home-hero">
      <div class="join-wrap glassy" role="group" aria-label="Создать или присоединиться">
        <div class="join-row">
          <a class="btn btn--primary" data-link="event-edit">Создать событие</a>
          <input
            id="joinCode"
            class="pill-input"
            inputmode="numeric"
            maxlength="6"
            placeholder="Введите 6-значный код"
            aria-label="Код приглашения"
          />
          <button id="btnJoin" class="btn" data-action="join">Присоединиться</button>
        </div>
      </div>
    </section>
  </main>

  <!-- остальной код страницы, скрипты и т.д. оставь как есть -->

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Public env -->
  <script src="env.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
