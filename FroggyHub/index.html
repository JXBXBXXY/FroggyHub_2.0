<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FroggyHub</title>

  <!-- ТВОЙ CSS -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ENV: на Netlify добавь window.ENV через Snippet или отдельный env.js -->
  <script>
    window.ENV = window.ENV || {
      PUBLIC_SUPABASE_URL: "PUBLIC_SUPABASE_URL",
      PUBLIC_SUPABASE_ANON_KEY: "PUBLIC_SUPABASE_ANON_KEY"
    };
  </script>
  <style>
    /* на всякий случай: экранный переключатель */
    .screen { display: none; }
    .screen.visible { display: block; }
    /* чипы не мешают кликам */
    #fh-message-clouds { z-index: 0; pointer-events: none; }
    .fh-chip {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.9);
      padding: 8px 12px; border-radius: 999px;
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
  </style>
</head>
<body>

    <nav class="topbar">
      <a class="logo" href="./">FroggyHub</a>
      <div class="topbar-right">
        <a class="btn btn--chip" data-authed href="./hub.html">Меню</a>
        <a class="btn btn--chip" data-authed href="./profile.html">Профиль</a>
        <a class="btn btn--chip" data-authed id="btn-logout" href="#">Выйти</a>
        <a class="btn btn--chip" data-guest  href="./login.html">Войти</a>
      </div>
    </nav>

  <!-- Фоновые “смски” -->
  <div id="fh-message-clouds" aria-hidden="true"></div>

  <!-- ЭКРАН: МЕНЮ/ЛОББИ -->
  <section id="screen-home" class="screen visible">
    <div class="container">
      <div class="card">
        <div class="row" style="gap:12px; align-items:center;">
          <button class="btn btn--primary">Создать событие</button>
          <input type="text" class="input" placeholder="Введите 6-значный код" style="max-width:260px;">
          <button class="btn">Присоединиться</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ЭКРАН: АВТОРИЗАЦИЯ -->
  <section id="screen-auth" class="screen">
    <div class="container">
      <div class="auth-card-wrap">
        <div class="auth-card">
          <div class="tabs">
            <div class="tab active" data-auth-tab="login">Вход</div>
            <div class="tab" data-auth-tab="signup">Регистрация</div>
            <div class="tab" data-auth-tab="reset">Сброс</div>
          </div>

          <!-- Login -->
          <form id="formLogin">
            <div id="paneLogin">
              <div class="stack">
                <input name="login" type="text" placeholder="Email или ник" required />
                <input name="password" type="password" placeholder="Пароль" required />
                <button class="btn btn--primary btn--xl" type="submit">Войти</button>
                <div class="form-error is-hidden"></div>
              </div>
            </div>
          </form>

          <!-- Signup -->
          <form id="formSignup" class="is-hidden">
            <div id="paneSignup">
              <div class="stack">
                <input name="nickname" type="text" placeholder="Никнейм" required />
                <input name="email" type="email" placeholder="Email" required />
                <input name="password" type="password" placeholder="Пароль" required />
                <button class="btn btn--primary btn--xl" type="submit">Создать аккаунт</button>
                <div class="form-error is-hidden"></div>
              </div>
            </div>
          </form>

          <!-- Reset -->
          <form id="formReset" class="is-hidden">
            <div id="paneReset">
              <div class="stack">
                <input name="email" type="email" placeholder="Ваш email" required />
                <button class="btn btn--primary btn--xl" type="submit">Сбросить пароль</button>
                <div class="form-error is-hidden"></div>
                <div class="form-success is-hidden">Письмо отправлено (если email существует).</div>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>
  </section>

  <!-- ЭКРАН: ПРОФИЛЬ -->
  <section id="screen-profile" class="screen">
    <div class="container">
      <div class="card">
        <h2>Профиль</h2>
        <div class="stack">
          <div>Никнейм: <b id="profNick">—</b></div>
          <div>Создан: <b id="profCreated">—</b></div>
          <div class="row">
            <a href="#" class="btn" data-link="home">← В лобби</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ТВОЙ app.js -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
