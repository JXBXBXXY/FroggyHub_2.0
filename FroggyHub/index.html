<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>FroggyHub — события и вишлисты</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <script>
  (function(){
    const E = (window.ENV ||= {});
    const u = (E.PUBLIC_SUPABASE_URL || '').trim();
    const k = (E.PUBLIC_SUPABASE_ANON_KEY || '').trim();
    if (!/^https?:\/\//i.test(u)) E.PUBLIC_SUPABASE_URL = '';
    if (!k || k.includes('PUBLIC_SUPABASE_ANON_KEY')) E.PUBLIC_SUPABASE_ANON_KEY = '';
  })();
  </script>
</head>
<body>
  <div class="scene-intro allow-scroll"></div>
  <div id="fh-message-clouds" aria-hidden="true">
    <!-- тут JS будет монтировать .fh-chip -->
  </div>

  <!-- ЭКРАНЫ -->
  <section id="screen-auth"  class="screen container" role="main" aria-hidden="true"></section>
  <section id="screen-home"  class="screen" aria-hidden="true"></section>
  <section id="screen-join"  class="screen" aria-hidden="true"></section>
  <section id="screen-wishlist" class="screen" data-scroll="auto" role="main" aria-hidden="true"></section>
  <section id="screen-create" class="screen" aria-hidden="true"></section>
  <section id="screen-profile" class="screen" aria-hidden="true"></section>
  <section id="screen-settings" class="screen" aria-hidden="true"></section>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
