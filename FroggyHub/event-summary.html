<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Итоги события</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="authed">
  <header class="topbar">
    <button data-link="menu" class="btn">Меню</button>
    <button data-action="logout" class="btn">Выйти</button>
  </header>

  <main class="container">
    <div class="card">
      <h1>Итоги события</h1>

      <div class="grid two">
        <div>
          <h3>Название</h3>
          <p id="sumTitle">—</p>
        </div>
        <div>
          <h3>Дата</h3>
          <p id="sumDate">—</p>
        </div>
        <div>
          <h3>Время</h3>
          <p id="sumTime">—</p>
        </div>
        <div>
          <h3>Адрес</h3>
          <p id="sumAddr">—</p>
        </div>
        <div class="col-span-2">
          <h3>Заметки</h3>
          <p id="sumNotes">—</p>
        </div>
      </div>

      <hr>

      <div class="invite">
        <h3>Код для приглашения гостей</h3>
        <p class="code"><span id="sumCode">— — — — — —</span></p>
        <button id="sumCopy" class="btn btn-secondary">Скопировать код</button>
        <button id="toAnalytics" class="btn btn-primary">Открыть аналитику</button>
      </div>
    </div>
  </main>

  <div id="toast" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
