<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSVP</title>
  <link rel="stylesheet" href="/style.css?v=glass-18">
</head>
<body class="guest">
<header class="topbar">
  <a class="logo fh-logo" data-link="home">FroggyHub</a>
  <div class="topbar-right">
    <button class="btn" data-link="menu">Меню</button>
    <button class="btn" data-link="profile">Профиль</button>
    <button class="btn" data-link="settings">Настройки</button>
    <button class="btn" data-action="logout">Выйти</button>
  </div>
</header>
<div id="fh-message-clouds" aria-hidden="true"></div>
<main class="container">
  <div class="card">
    <form id="formRsvp">
      <label>Имя
        <input id="guestName" required />
      </label>
      <div class="rsvp-radio">
        <label><input type="radio" name="attend" value="yes" required /> Иду</label>
        <label><input type="radio" name="attend" value="no" required /> Не иду</label>
      </div>
      <button class="btn btn--primary" type="submit">Дальше</button>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="env.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
