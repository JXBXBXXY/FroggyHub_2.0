<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Подарки</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="guest">
<header class="topbar">
  <a class="logo fh-logo" data-link="home">FroggyHub</a>
  <div class="topbar-right">
    <button class="btn" data-link="menu">Меню</button>
    <button class="btn" data-link="profile">Профиль</button>
    <button class="btn" data-link="settings">Настройки</button>
    <button class="btn" data-action="logout">Выйти</button>
  </div>
</header>
<div id="fh-message-clouds" aria-hidden="true"></div>
<main class="container">
  <div class="card">
    <h1>Вишлист</h1>
    <div id="wlGrid" class="wl-grid"></div>
    <div class="bar-actions" style="margin-top:1.5rem;">
      <button class="btn btn--primary" id="giftNext">Дальше</button>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/env.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
