<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лобби — FroggyHub</title>
<link rel="stylesheet" href="/style.css?v=5">
</head>
<body class="guest">
  <div id="fh-message-clouds" aria-hidden="true"></div>
  <header class="topbar" data-auth-only>
    <a href="#" class="logo" data-link="home">FroggyHub</a>
    <div class="topbar-right">
      <button data-link="menu">Меню</button>
      <button data-link="profile">Профиль</button>
      <button data-action="logout">Выйти</button>
    </div>
  </header>

  <main class="fh-content" data-auth-only>
    <div class="container">
      <div class="menu-grid">
        <button data-link="event-edit" class="btn btn--primary">Создать событие</button>
        <div class="join-row">
          <input id="joinCode" type="text" maxlength="6" placeholder="Введите 6-значный код" />
          <button id="btnJoin" class="btn btn--secondary">Присоединиться</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Public env -->
  <script src="env.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
