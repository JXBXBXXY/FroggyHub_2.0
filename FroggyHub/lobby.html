<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лобби — FroggyHub</title>
  <link rel="stylesheet" href="/style.css?v=glass-17">
</head>
<body class="guest">
  <div id="fh-message-clouds" aria-hidden="true"></div>
  <header class="topbar" data-auth-only>
    <button data-link="menu">Меню</button>
    <button data-link="profile">Профиль</button>
    <button data-action="logout">Выйти</button>
  </header>

  <main id="home" class="home-screen">
    <section class="home-hero hero-center">
      <div class="join-wrap glassy hero-card" role="group" aria-label="Создать или присоединиться">
        <div class="join-row hero-row">
          <a class="btn btn--primary" data-link="event-edit">Создать событие</a>
          <input
            id="joinCode"
            class="pill-input"
            inputmode="numeric"
            maxlength="6"
            placeholder="Введите 6-значный код"
            aria-label="Код приглашения"
          />
          <button id="btnJoin" class="btn" data-action="join">Присоединиться</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Public env -->
  <script src="env.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
