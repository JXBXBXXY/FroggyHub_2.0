<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Лобби — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat}
    @media (min-width:640px){.fh-bg{background-position:center}}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding-inline:1rem}
    .lobby-grid{max-width:1200px;margin:40px auto;display:grid;gap:24px;grid-template-columns:minmax(280px,1fr) minmax(420px,620px);align-items:start}
    .countdown-big{font-size:clamp(48px,8vw,96px);font-weight:800}
    .countdown-small{opacity:.85;margin-top:.25rem}
    .event-grid{display:grid;gap:.5rem 1rem;grid-template-columns:auto 1fr;margin-bottom:1rem}
    .event-grid>div{display:contents}
    .event-grid strong{opacity:.85}
    .codeRow{display:flex;align-items:center;gap:.5rem;margin:.5rem 0 1rem}
    #evCode{font-variant-numeric:tabular-nums}
    .guests-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:1rem}
    .guests-columns h4{margin-bottom:.5rem}

    /* wishlist бейджи */
    .wl-badge{display:inline-block;font-size:.85em;opacity:.9;padding:.2rem .55rem;border-radius:999px;border:1px solid rgba(255,255,255,.15);margin-left:.5rem}
    .wl-item{display:flex;justify-content:space-between;align-items:center}
    .wl-item a{color:inherit;text-decoration:underline}
    .hint{opacity:.8}
  </style>
</head>
<body data-page="lobby">

  <div class="fh-bg" aria-hidden="true"></div>

  <div class="fh-content">
    <header class="fh-header">
      <a class="fh-logo" href="/">FroggyHub</a>
      <nav class="topbar">
        <a href="/index.html" class="btn btn--ghost btn--sm">Меню</a>
        <a href="/profile.html" class="btn btn--ghost btn--sm">Профиль</a>
        <a href="/wishlist.html" class="btn btn--ghost btn--sm">Редактировать wishlist</a>
      </nav>
    </header>

    <main class="lobby-grid">
      <section id="lobby-left" class="lobby-left">
        <div class="frog-hero"></div>
        <div class="countdown">
          <div class="countdown-big" id="cdBig">00:00</div>
          <div class="countdown-small" id="cdSmall">—</div>
        </div>
      </section>

      <section id="lobby-right" class="lobby-right glass">
        <h2 id="evTitle">Событие</h2>

        <div class="lobby-panels">

          <div class="glass-section">
            <div class="section-title">🔑 Код</div>
            <div class="codeRow">
              <div><b id="evCode">—</b></div>
              <button id="copyInviteBtn" class="btn btn--ghost btn--sm">Скопировать приглашение</button>
            </div>

            <div style="margin:.5rem 0 0">
              <button id="saveEventBtn" class="btn btn--primary">Сохранить событие</button>
            </div>
          </div>

          <div class="glass-section">
            <div class="section-title">📅 Детали</div>
            <div class="event-grid">
              <div><strong>Когда:</strong></div><div id="evWhen">—</div>
              <div><strong>Адрес:</strong></div><div id="evAddr">—</div>
              <div><strong>Дресс-код:</strong></div><div id="evDress">—</div>
              <div><strong>Что взять:</strong></div><div id="evBring">—</div>
              <div><strong>Комментарий:</strong></div><div id="evNotes">—</div>
            </div>
          </div>

          <div class="glass-section">
            <div class="section-title">🎁 Wishlist</div>
            <ul class="list" id="evWishlist"></ul>
            <p id="wlError" class="error" style="margin-top:.5rem"></p>
          </div>

          <div class="glass-section">
            <div class="section-title">👥 Гости</div>
            <div class="guests-columns">
              <div><h4>Идут</h4><ul class="list" id="guestYes"></ul></div>
              <div><h4>Не идут</h4><ul class="list" id="guestNo"></ul></div>
              <div><h4>Может быть</h4><ul class="list" id="guestMaybe"></ul></div>
            </div>
          </div>

          <div class="glass-section">
            <a class="btn btn--ghost" href="/index.html">Вернуться в меню</a>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- Делаем модуль, чтобы импортировать supabase-клиент -->
  <script type="module">
    import { supa } from '/js/api.js';

    // draft helpers
    const readDraft = () => { try { return JSON.parse(sessionStorage.getItem('fh:draftEvent')||'{}') } catch { return {} } };
    const writeDraft = (d) => { try { sessionStorage.setItem('fh:draftEvent', JSON.stringify(d)) } catch {} };
    let draft = readDraft();
    try { if (draft?.id) localStorage.setItem('fh:lastEventId', draft.id); } catch {}

    // ui helpers
    const $ = (id) => document.getElementById(id);
    const pad = (n) => n.toString().padStart(2,'0');
    const same = (a='',b='') => a.trim().toLowerCase() === b.trim().toLowerCase();
    const myName = (draft?.lastJoinName || '').trim();

    const formatWhen = (d) => {
      if (!d?.date && !d?.time) return '—';
      const dt = new Date(`${d.date||''}T${d.time||'00:00'}`);
      if (isNaN(dt)) return '—';
      const dateFmt = dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
      const timeFmt = pad(dt.getHours())+':'+pad(dt.getMinutes());
      return `${dateFmt}${d.time ? ' в '+timeFmt : ''}`;
    };

    function renderWishlistDraftOnly() {
      const box = $('evWishlist'); box.innerHTML='';
      const items = Array.isArray(draft?.wishlist) ? draft.wishlist : [];
      if (items.length === 0) {
        const li=document.createElement('li'); li.className='hint';
        li.textContent='Пока пусто. Нажмите «Редактировать wishlist».';
        box.appendChild(li);
      } else {
        items.forEach(({title,url})=>{
          const li=document.createElement('li');
          li.className='wl-item';
          const left=document.createElement('div');
          if (url) left.innerHTML=`<a href="${url}" target="_blank" rel="noopener">${title}</a>`;
          else left.textContent=title;
          li.appendChild(left);
          box.appendChild(li);
        });
      }
    }

    function renderStaticParts() {
      $('evTitle').textContent = draft.title || 'Событие';
      $('evAddr').textContent  = draft.address || '—';
      $('evDress').textContent = draft.dress   || '—';
      $('evBring').textContent = draft.bring   || '—';
      $('evNotes').textContent = draft.notes   || '—';
      $('evCode').textContent  = draft.code || '—';
      $('evWhen').textContent  = formatWhen(draft);

      if (draft?.date || draft?.time) {
        const dt = new Date(`${draft.date||''}T${draft.time||'00:00'}`);
        if (!isNaN(dt)) {
          $('cdBig').textContent = pad(dt.getHours())+':'+pad(dt.getMinutes());
          $('cdSmall').textContent = dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
        }
      }

      ['guestYes','guestNo','guestMaybe'].forEach(id=>{
        const ul=$(id); if (ul) ul.innerHTML='';
      });
    }

    renderStaticParts();
    renderWishlistDraftOnly(); // сразу что-то показать

    // копирование инвайта
    document.getElementById('copyInviteBtn').addEventListener('click', async () => {
      const origin = location.origin || 'https://froggyhubapp.netlify.app';
      const text = `Приглашаю на "${draft.title || 'событие'}"!\nКод для присоединения: ${draft.code || '—'}\nЗайди на ${origin} и введи этот код.`;
      try { await navigator.clipboard.writeText(text); alert('Приглашение скопировано в буфер обмена!'); }
      catch {
        const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove(); alert('Приглашение скопировано в буфер обмена!');
      }
    });

    // серверные вспомогалки (как и было)
    async function fetchEventByCode(code) {
      try {
        const r = await fetch('/.netlify/functions/events-get?code=' + encodeURIComponent(code));
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    }

    async function saveEventToServer() {
      const payload = {
        code: String(draft.code || ''),
        title: draft.title || 'Моё событие',
        date: draft.date, time: draft.time,
        address: draft.address || null,
        dress_code: draft.dress || null,
        what_to_bring: draft.bring || null,
        comment: draft.notes || null,
        wishlist: Array.isArray(draft.wishlist) ? draft.wishlist.map(i => ({ title: i?.title || '', url: i?.url || null })) : []
      };
      const r = await fetch('/.netlify/functions/event-create', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const data = await r.json().catch(()=> ({}));
      if (!r.ok || !data?.event?.id) throw new Error(data?.error || 'Create failed');
      return data.event;
    }

    async function ensureEventExistsInDb() {
      if (draft.savedToDbForCode && draft.code && String(draft.savedToDbForCode) === String(draft.code)) return;
      if (!draft.code) return;
      const ev = await fetchEventByCode(draft.code);
      if (ev) {
        draft = {
          ...draft,
          id: ev.id,
          code: ev.code || ev.join_code || draft.code,
          title: ev.title ?? draft.title,
          date: ev.date ?? draft.date,
          time: ev.time ?? draft.time,
          address: ev.address ?? draft.address,
          dress: ev.dress_code ?? draft.dress,
          bring: ev.what_to_bring ?? draft.bring,
          notes: ev.comment ?? draft.notes,
          savedToDbForCode: String(ev.code || ev.join_code || draft.code),
        };
        writeDraft(draft);
        try { localStorage.setItem('fh:lastEventId', draft.id); } catch {}
        renderStaticParts();
      }
    }

    // === Новое: загрузка wishlist из БД и рендер с claimed_by ===
    async function loadWishlistFromDb() {
      const box = $('evWishlist'); const err = $('wlError');
      err.textContent = '';
      if (!draft?.id) { renderWishlistDraftOnly(); return; }

      try {
        const { data, error } = await supa
          .from('wishlist_items')
          .select('id,title,url,claimed_by')
          .eq('event_id', draft.id)
          .order('id', { ascending: true });

        box.innerHTML = '';

        if (error) throw error;

        if (!data || data.length === 0) {
          const li=document.createElement('li'); li.className='hint';
          li.textContent='Пока пусто. Нажмите «Редактировать wishlist».';
          box.appendChild(li);
          return;
        }

        data.forEach(item => {
          const li = document.createElement('li');
          li.className = 'wl-item';

          const left = document.createElement('div');
          if (item.url) left.innerHTML = `<a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>`;
          else left.textContent = item.title;

          // бейдж
          const badge = document.createElement('span');
          badge.className = 'wl-badge';
          if (!item.claimed_by) badge.textContent = 'Свободно';
          else if (same(item.claimed_by, myName)) badge.textContent = 'Ваш выбор';
          else badge.textContent = item.claimed_by;

          left.appendChild(badge);
          li.appendChild(left);
          box.appendChild(li);
        });
      } catch (e) {
        console.error('[wishlist] load error:', e);
        $('evWishlist').innerHTML = '';
        const li=document.createElement('li'); li.className='hint';
        li.textContent='Не удалось загрузить список из БД. Показан локальный черновик.';
        $('evWishlist').appendChild(li);
        err.textContent = '';
      }
    }

    document.getElementById('saveEventBtn')?.addEventListener('click', async () => {
      if (!draft.date || !draft.time) { alert('Сначала укажи дату и время 🙂'); return; }
      if (draft.savedToDbForCode && String(draft.savedToDbForCode) === String(draft.code)) {
        alert('Событие уже сохранено. Код: '+draft.code); return;
      }
      const btn = document.getElementById('saveEventBtn');
      const old = btn.textContent;
      btn.disabled = true; btn.textContent = 'Сохраняем...';
      try {
        const created = await saveEventToServer();
        draft.id = created.id;
        draft.code = created.code || created.join_code || draft.code;
        draft.savedToDbForCode = String(draft.code);
        writeDraft(draft);
        try { localStorage.setItem('fh:lastEventId', draft.id); } catch {}
        renderStaticParts();
        await loadWishlistFromDb(); // сразу подтянуть список из БД
        alert('Сохранено! Код: ' + draft.code);
      } catch (e) {
        console.error(e);
        alert('Не получилось сохранить. Попробуй ещё раз.');
      } finally {
        btn.disabled = false; btn.textContent = old;
      }
    });

    // Стартовая синхронизация + загрузка вишлиста из БД (если есть id)
    await ensureEventExistsInDb();
    await loadWishlistFromDb();
  </script>
</body>
</html>
