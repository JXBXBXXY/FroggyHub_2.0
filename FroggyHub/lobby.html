<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лобби — FroggyHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="guest">
<header class="topbar">
  <a class="logo fh-logo" data-link="home">FroggyHub</a>
  <div class="topbar-right">
    <button class="btn" data-link="menu">Меню</button>
    <button class="btn" data-link="profile">Профиль</button>
    <button class="btn" data-link="settings">Настройки</button>
    <button class="btn" data-action="logout">Выйти</button>
  </div>
</header>
<div id="fh-message-clouds" aria-hidden="true"></div>

<main class="fh-cta" role="main" aria-label="Главные действия">
  <div class="cta-card">
    <button type="button" class="btn btn--primary" data-link="event-edit">Создать событие</button>
    <div class="join-row">
      <input
        id="join-code"
        class="pill-input"
        inputmode="numeric"
        maxlength="6"
        placeholder="Введите 6-значный код"
        aria-label="Код приглашения"
      />
      <button id="btnJoin" class="btn" data-action="join">Присоединиться</button>
    </div>
  </div>
</main>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Public env -->
<script src="/env.js"></script>
<!-- App -->
<script type="module" src="/js/app.js"></script>
</body>
</html>
