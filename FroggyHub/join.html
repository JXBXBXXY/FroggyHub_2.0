<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Присоединиться — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding-inline:1rem}
    .join-card{max-width:720px;margin:48px auto}
    .rsvp-row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0 0}
    .rsvp-row .btn{opacity:.8}
    .rsvp-row .btn.is-active{opacity:1;box-shadow:0 0 0 2px rgba(255,255,255,.15) inset}
    .code-pill{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .7rem;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
    #join-error{color:#ffb4b4;margin-top:.5rem;min-height:1.25em}
  </style>
</head>
<body data-page="join">
  <div class="fh-bg" aria-hidden="true"></div>

  <div class="fh-content">
    <header class="fh-header">
      <a class="fh-logo" href="/">FroggyHub</a>
      <nav class="topbar">
        <a href="/index.html" class="btn btn--ghost btn--sm">Меню</a>
      </nav>
    </header>

    <main class="container">
      <section class="card join-card">
        <h2>Присоединиться к событию</h2>

        <p style="margin:.5rem 0 1rem">
          Код приглашения: <span class="code-pill"><strong id="join-code-text">— — — — — —</strong></span>
        </p>

        <div class="grid" style="grid-template-columns:1fr;gap:12px">
          <label>Ваше имя / ник
            <input id="join-name" type="text" autocomplete="name" placeholder="Например, Кира" required>
          </label>

          <div>
            <div style="opacity:.85;margin-bottom:.25rem">Ваш статус:</div>
            <div id="join-status-wrap" class="rsvp-row">
              <button type="button" class="btn btn--ghost is-active" data-rsvp="yes">Иду</button>
              <button type="button" class="btn btn--ghost" data-rsvp="maybe">Может быть</button>
              <button type="button" class="btn btn--ghost" data-rsvp="no">Не иду</button>
            </div>
          </div>

          <div id="join-error" aria-live="polite"></div>

          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <button id="btn-join" class="btn btn--primary">Присоединиться</button>
            <a class="btn btn--ghost" href="/index.html">Отмена</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- НИКАКИХ других скриптов. Вся логика — в app.js/bindJoinPage(). -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
