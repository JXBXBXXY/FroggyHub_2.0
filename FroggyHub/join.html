<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Присоединиться к событию — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat;}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding:2rem 1rem;display:grid;place-items:start center}
    .join-card{max-width:720px;width:min(720px,100%);margin:0 auto}
    .status-row{display:flex;gap:.5rem;flex-wrap:wrap}
    .status-row .btn{min-width:120px}
    .muted{opacity:.8}
    .hidden{display:none}
  </style>
</head>
<body data-page="join">
  <div class="fh-bg" aria-hidden="true"></div>
  <div class="fh-content">
    <main class="card join-card">
      <h1 id="pageTitle">Присоединиться к событию</h1>

      <!-- Шаг А: ввод кода -->
      <form id="step-code" class="grid hidden" autocomplete="off">
        <label>Код приглашения
          <input id="codeInput" inputmode="numeric" pattern="\\d{6}" maxlength="6" placeholder="123456" />
        </label>
        <div class="grid" style="grid-template-columns:auto auto;gap:.75rem;align-items:center">
          <a class="btn btn--ghost" href="/index.html">Отмена</a>
          <button type="submit" class="btn btn--primary">Дальше</button>
        </div>
        <p class="muted">Вставьте код из приглашения и нажмите «Дальше».</p>
        <p id="codeError" class="error" role="status" aria-live="polite"></p>
      </form>

      <!-- Шаг B: имя + статус -->
      <p id="codeInfo" class="muted hidden">Код: <strong id="evCode">—</strong></p>
      <form id="step-rsvp" class="grid hidden" autocomplete="off">
        <label>Ваше имя
          <input id="guestName" name="guestName" required minlength="2" placeholder="Например, Анна" />
        </label>

        <fieldset>
          <legend>Статус</legend>
          <div class="status-row">
            <label class="btn btn--ghost"><input type="radio" name="status" value="yes" checked hidden> Иду</label>
            <label class="btn btn--ghost"><input type="radio" name="status" value="no" hidden> Не иду</label>
            <label class="btn btn--ghost"><input type="radio" name="status" value="maybe" hidden> Может быть</label>
          </div>
        </fieldset>

        <div class="grid" style="grid-template-columns:1fr auto;gap:.75rem;align-items:center">
          <a class="btn btn--ghost" href="/index.html">Отмена</a>
          <button id="joinSubmit" type="submit" class="btn btn--primary">Присоединиться</button>
        </div>

        <p id="joinError" class="error" role="status" aria-live="polite"></p>
        <p id="joinOk" class="success hidden" role="status" aria-live="polite">Готово! Открою список подарков…</p>
      </form>
    </main>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const qs = new URLSearchParams(location.search);
    const codeFromUrl = (qs.get('code') || '').trim().toUpperCase();

    const pageTitle = $('pageTitle');
    const stepCode  = $('step-code');
    const codeInput = $('codeInput');
    const codeError = $('codeError');

    const stepRsvp  = $('step-rsvp');
    const evCodeEl  = $('evCode');
    const codeInfo  = $('codeInfo');
    const guestName = $('guestName');
    const joinError = $('joinError');
    const joinOk    = $('joinOk');
    const joinBtn   = $('joinSubmit');

    // Подсветка выбранной «кнопки»
    document.querySelectorAll('label.btn input[type="radio"]').forEach(input => {
      input.addEventListener('change', () => {
        document.querySelectorAll('label.btn').forEach(l => l.classList.remove('btn--primary'));
        input.closest('label.btn').classList.add('btn--primary');
      });
    });

    let eventRow = null;

    // ---- режимы страницы ----
    if (!codeFromUrl) {
      // Шаг А: ввод кода
      stepCode.classList.remove('hidden');
      pageTitle.textContent = 'Присоединиться к событию';
      codeInput.focus();

      stepCode.addEventListener('submit', async (e) => {
        e.preventDefault();
        codeError.textContent = '';
        const raw = (codeInput.value || '').trim();
        const code = raw.toUpperCase();

        if (!/^\d{6}$/.test(code)) {
          codeError.textContent = 'Введите 6 цифр.';
          return;
        }

        // валидируем существование события, чтобы не вести на пустую форму
        try {
          const r = await fetch('/.netlify/functions/events-get?code=' + encodeURIComponent(code));
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            codeError.textContent = data?.error || 'Event not found';
            return;
          }
          // ок — ведём на шаг с именем
          location.href = `/join.html?code=${encodeURIComponent(code)}`;
        } catch {
          codeError.textContent = 'Не удалось проверить код. Проверьте интернет.';
        }
      });
    } else {
      // Шаг B: имя + статус
      stepRsvp.classList.remove('hidden');
      codeInfo.classList.remove('hidden');
      evCodeEl.textContent = codeFromUrl;
      pageTitle.textContent = 'Присоединиться к событию';

      // грузим событие
      try {
        const r = await fetch('/.netlify/functions/events-get?code=' + encodeURIComponent(codeFromUrl));
        const data = await r.json();
        if (!r.ok) {
          joinError.textContent = data?.error || 'Событие с таким кодом не найдено.';
          joinBtn.disabled = true;
        } else {
          eventRow = data;
          pageTitle.textContent = `Присоединиться: ${data.title}`;
          joinBtn.disabled = false;
        }
      } catch {
        joinError.textContent = 'Не удалось загрузить событие. Проверьте интернет.';
        joinBtn.disabled = true;
      }

      stepRsvp.addEventListener('submit', async (e) => {
        e.preventDefault();
        joinError.textContent = '';
        joinOk.classList.add('hidden');

        if (!eventRow?.id) { joinError.textContent = 'Событие не найдено.'; return; }

        const name = (guestName.value || '').trim();
        const status = (stepRsvp.querySelector('input[name="status"]:checked')?.value) || 'yes';
        if (name.length < 2) { joinError.textContent = 'Введите имя (минимум 2 символа).'; return; }

        joinBtn.disabled = true;

        try {
          const r = await fetch('/.netlify/functions/events-rsvp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ event_id: eventRow.id, guest_name: name, status })
          });
          const res = await r.json().catch(() => ({}));
          if (!r.ok || res?.error) {
            joinError.textContent = res?.error || 'Не получилось сохранить ваш ответ. Попробуйте ещё раз.';
            joinBtn.disabled = false;
            return;
          }

          joinOk.classList.remove('hidden');
          const targetCode = eventRow.code || eventRow.join_code || codeFromUrl;
          setTimeout(() => {
            location.href = `/wishlist-claim.html?code=${encodeURIComponent(targetCode)}&name=${encodeURIComponent(name)}`;
          }, 400);
        } catch {
          joinError.textContent = 'Не получилось отправить ответ. Проверьте интернет.';
          joinBtn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
