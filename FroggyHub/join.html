<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Присоединиться к событию — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat;}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding:2rem 1rem;display:grid;place-items:start center}
    .join-card{max-width:720px;width:min(720px,100%);margin:0 auto}
    .status-row{display:flex;gap:.5rem;flex-wrap:wrap}
    .status-row .btn{min-width:120px}
    .muted{opacity:.8}
    .hidden{display:none}
    .code-row{display:flex;gap:.5rem;align-items:end}
    .code-row input{font-variant-numeric:tabular-nums}
  </style>
</head>
<body data-page="join">
  <div class="fh-bg" aria-hidden="true"></div>
  <div class="fh-content">
    <main class="card join-card">
      <h1 id="evTitle">Присоединиться к событию</h1>

      <!-- Блок ввода кода (покажется, если кода нет или он неверный) -->
      <section id="codeSection" class="grid hidden" style="margin-bottom:1rem">
        <label>Код приглашения
          <div class="code-row">
            <input id="codeInput" inputmode="numeric" pattern="\\d{6}|[A-Za-z0-9]{6}" placeholder="Например, 123456" />
            <button id="codeApply" class="btn btn--primary">Дальше</button>
          </div>
        </label>
        <p class="muted">Вставьте код из приглашения и нажмите «Дальше».</p>
      </section>

      <!-- Линия с кодом, когда он валиден -->
      <p id="codeLine" class="muted hidden">Код: <strong id="evCode">—</strong></p>

      <!-- Основная форма RSVP (покажется, когда событие найдено) -->
      <form id="joinForm" class="grid hidden" autocomplete="off">
        <label>Ваше имя
          <input id="guestName" name="guestName" required minlength="2" placeholder="Например, Анна" />
        </label>

        <fieldset>
          <legend>Статус</legend>
          <div class="status-row">
            <label class="btn btn--ghost"><input type="radio" name="status" value="yes" checked hidden> Иду</label>
            <label class="btn btn--ghost"><input type="radio" name="status" value="no" hidden> Не иду</label>
            <label class="btn btn--ghost"><input type="radio" name="status" value="maybe" hidden> Может быть</label>
          </div>
        </fieldset>

        <div class="grid" style="grid-template-columns:1fr auto;gap:.75rem;align-items:center">
          <a class="btn btn--ghost" href="/index.html">Отмена</a>
          <button id="joinSubmit" type="submit" class="btn btn--primary">Присоединиться</button>
        </div>

        <p id="joinOk" class="success hidden" role="status" aria-live="polite">Готово! Открою список подарков…</p>
      </form>

      <p id="joinError" class="error" role="status" aria-live="polite" style="margin-top:.5rem"></p>
    </main>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const norm = v => String(v||'').trim().toUpperCase();

    const evTitleEl = $('evTitle');
    const evCodeEl  = $('evCode');
    const codeLine  = $('codeLine');
    const form      = $('joinForm');
    const errorEl   = $('joinError');
    const okEl      = $('joinOk');
    const submitBtn = $('joinSubmit');

    const codeSection = $('codeSection');
    const codeInput   = $('codeInput');
    const codeApply   = $('codeApply');

    // подсветка выбранной «кнопки»
    document.querySelectorAll('label.btn input[type="radio"]').forEach(input => {
      input.addEventListener('change', () => {
        document.querySelectorAll('label.btn').forEach(l => l.classList.remove('btn--primary'));
        input.closest('label.btn').classList.add('btn--primary');
      });
    });

    let eventRow = null;
    let code = norm(params.get('code'));

    function showAskCode(msg='') {
      form.classList.add('hidden');
      codeLine.classList.add('hidden');
      codeSection.classList.remove('hidden');
      if (msg) errorEl.textContent = msg;
      codeInput.value = code.replace(/[^A-Za-z0-9]/g,'');
      codeInput.focus();
    }

    function showForm() {
      codeSection.classList.add('hidden');
      codeLine.classList.remove('hidden');
      form.classList.remove('hidden');
    }

    async function loadEventByCode(c) {
      const valid = /^[A-Z0-9]{6}$/.test(c);
      if (!valid) { showAskCode('Введите корректный 6-значный код.'); return; }
      errorEl.textContent = '';
      try {
        const r = await fetch('/.netlify/functions/events-get?code=' + encodeURIComponent(c));
        const data = await r.json();
        if (!r.ok) {
          showAskCode(data?.error || 'Событие не найдено. Проверьте код.');
          return;
        }
        eventRow = data;
        code = norm(eventRow.code || eventRow.join_code || c);
        evCodeEl.textContent = code;
        evTitleEl.textContent = `Присоединиться: ${data.title}`;
        submitBtn.disabled = false;
        showForm();
        // синхронизируем URL
        const url = new URL(location.href);
        url.searchParams.set('code', code);
        history.replaceState(null, '', url);
      } catch (e) {
        console.error(e);
        showAskCode('Не удалось загрузить событие. Проверьте интернет.');
      }
    }

    // обработка ввода кода
    codeApply.addEventListener('click', () => loadEventByCode(norm(codeInput.value)));
    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); codeApply.click(); }
    });

    // сабмит RSVP
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      okEl.classList.add('hidden');

      if (!eventRow?.id) { errorEl.textContent = 'Событие не найдено.'; return; }

      const guestName = (form.guestName.value || '').trim();
      const status = (form.querySelector('input[name="status"]:checked')?.value) || 'yes';
      if (guestName.length < 2) { errorEl.textContent = 'Введите имя (минимум 2 символа).'; return; }

      submitBtn.disabled = true;
      try {
        const r = await fetch('/.netlify/functions/events-rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event_id: eventRow.id, guest_name: guestName, status })
        });
        const res = await r.json().catch(() => ({}));
        if (!r.ok || res?.error) {
          console.error('RSVP error:', res);
          errorEl.textContent = res?.error || 'Не получилось сохранить ваш ответ. Попробуйте ещё раз.';
          submitBtn.disabled = false;
          return;
        }
        okEl.classList.remove('hidden');
        const targetCode = eventRow.code || eventRow.join_code || code;
        setTimeout(() => {
          location.href = `/wishlist-claim.html?code=${encodeURIComponent(targetCode)}&name=${encodeURIComponent(guestName)}`;
        }, 400);
      } catch (e) {
        console.error(e);
        errorEl.textContent = 'Не получилось отправить ответ. Проверьте интернет.';
        submitBtn.disabled = false;
      }
    });

    // старт: если кода нет в URL — просим его
    if (!/^[A-Z0-9]{6}$/.test(code)) {
      showAskCode();
    } else {
      loadEventByCode(code);
    }
  </script>
</body>
</html>
