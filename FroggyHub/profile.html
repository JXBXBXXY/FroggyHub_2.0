<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Профиль — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat;}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding:2rem 1rem;display:grid;place-items:start center}
    .box{max-width:720px;width:min(720px,100%);margin:0 auto}
    .muted{opacity:.85}
  </style>
</head>
<body>
  <div class="fh-bg" aria-hidden="true"></div>

  <div class="fh-content">
    <main class="card box">
      <header class="row between" style="margin-bottom:1rem">
        <h2>Профиль</h2>
        <nav class="row" style="gap:.5rem">
          <a class="btn btn--ghost btn--sm" href="/index.html">Меню</a>
          <a class="btn btn--ghost btn--sm" href="/wishlist.html">Редактировать wishlist</a>
        </nav>
      </header>

      <form id="form" class="grid" autocomplete="off">
        <label>E-mail
          <input id="email" class="input" type="email" readonly>
        </label>
        <label>Имя / Никнейм
          <input id="nickname" class="input" minlength="2" placeholder="Ваш ник">
        </label>
        <div class="row end" style="gap:.5rem">
          <button id="save" class="btn btn--primary" type="submit">Сохранить</button>
          <button id="logout" class="btn btn--ghost" type="button">Выйти</button>
        </div>
        <p id="msg" class="muted" aria-live="polite"></p>
      </form>
    </main>
  </div>

  <script type="module">
    import { supa } from '/js/api.js';

    const $ = (id) => document.getElementById(id);
    const emailEl = $('email');
    const nickEl  = $('nickname');
    const msgEl   = $('msg');
    const form    = $('form');

    async function load() {
      msgEl.textContent = '';
      const { data: sess } = await supa.auth.getSession();
      const session = sess?.session;
      if (!session) {
        // если юзер не залогинен — отправим на главную/авторизацию
        location.href = '/';
        return;
      }
      const user = session.user;
      emailEl.value = user.email || '';
      nickEl.value  = (user.user_metadata?.nickname || '').trim();

      // попробуем подтянуть ник из profiles (если есть доступ)
      try {
        const { data } = await supa.from('profiles').select('nickname').eq('id', user.id).maybeSingle();
        if (data?.nickname && !nickEl.value) nickEl.value = data.nickname;
      } catch {}
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.textContent = 'Сохраняем…';
      const nickname = (nickEl.value || '').trim();

      const { data: sess } = await supa.auth.getSession();
      const user = sess?.session?.user;
      if (!user) { location.href = '/'; return; }

      // 1) обновим user_metadata в auth
      const { error: authErr } = await supa.auth.updateUser({ data: { nickname } });
      if (authErr) { msgEl.textContent = 'Ошибка: ' + authErr.message; return; }

      // 2) попробуем синхронизировать в таблицу profiles (если включены RLS-политики)
      try {
        await supa.from('profiles').upsert({ id: user.id, nickname }, { onConflict: 'id' });
      } catch {}

      msgEl.textContent = 'Готово ✅';
      setTimeout(()=> msgEl.textContent = '', 1500);
    });

    $('logout')?.addEventListener('click', async () => {
      await supa.auth.signOut();
      location.href = '/';
    });

    load();
  </script>
</body>
</html>
