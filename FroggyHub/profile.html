<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Профиль — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding:2rem 1rem}

    /* topbar как на главной */
    .fh-header{display:flex;justify-content:flex-start;gap:12px;margin-bottom:16px}
    .topbar{
      display:flex;gap:8px;align-items:center;
      background:rgba(12,34,26,.55); border:1px solid rgba(255,255,255,.08);
      border-radius:999px; padding:6px; backdrop-filter:saturate(1.2) blur(10px);
      box-shadow:0 8px 24px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .topbar .btn{height:34px;line-height:32px;padding:0 12px}

    /* стекло-карточки как в финалке */
    .glass{
      background:rgba(15,45,35,.55);
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      box-shadow:0 20px 40px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter:blur(10px) saturate(120%);
    }
    .glass-section{
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:14px;
      margin:12px 16px;
      background:rgba(255,255,255,.03);
    }
    .chip{
      display:inline-block;
      padding:.2rem .6rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.15);
      opacity:.9;
    }

    .profile-wrap{max-width:960px;margin:0 auto}
    .profile-card{padding:0}
    .profile-head{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.06)}
    .profile-head h2{font-size:22px;font-weight:800;margin:0}
    .profile-actions{display:flex;gap:.5rem;justify-content:flex-end;padding:12px 16px}
    .tabs{display:flex;gap:6px;margin:0 16px 16px 16px}
    .tab{padding:.5rem .75rem;border-radius:999px;border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.04);cursor:pointer}
    .tab.is-active{background:rgba(255,255,255,.12)}
    .pane{padding:16px}
    .pane.is-hidden{display:none}

    .section-title{opacity:.9;margin:.75rem 0 .5rem;font-weight:700}
    .cards{display:grid;gap:10px}
    .event-card{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;
      background:rgba(255,255,255,.02);
    }
    .event-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .muted{opacity:.85}
    .mono{font-variant-numeric:tabular-nums}
    .hint{opacity:.75}

    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:720px){ .grid-2{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="fh-bg" aria-hidden="true"></div>

  <div class="fh-content">
    <!-- TOPBAR -->
    <header class="fh-header">
      <nav class="topbar">
        <a href="/" class="btn btn--ghost btn--sm">FroggyHub</a>
        <a href="/index.html" class="btn btn--ghost btn--sm">Меню</a>
        <a href="/profile.html" class="btn btn--ghost btn--sm">Профиль</a>
        <a href="/settings.html" class="btn btn--ghost btn--sm">Настройки</a>
      </nav>
    </header>

    <main class="profile-wrap">
      <section class="card profile-card glass">
        <div class="profile-head">
          <h2>Профиль</h2>
        </div>

        <!-- Вкладки -->
        <div class="tabs" role="tablist">
          <button class="tab is-active" id="tab-events"  aria-controls="pane-events"  aria-selected="true">События</button>
          <button class="tab"           id="tab-account" aria-controls="pane-account" aria-selected="false">Аккаунт</button>
        </div>

        <!-- Pane: События -->
        <section id="pane-events" class="pane" role="tabpanel" aria-labelledby="tab-events">
          <div class="glass-section">
            <div class="section-title">📅 Ближайшие</div>
            <div id="list-upcoming" class="cards"></div>
          </div>

          <div class="glass-section">
            <div class="section-title">⏳ Прошедшие</div>
            <div id="list-past" class="cards"></div>
          </div>
        </section>

        <!-- Pane: Аккаунт -->
        <section id="pane-account" class="pane is-hidden" role="tabpanel" aria-labelledby="tab-account">
          <form id="form-nick" class="grid-2" autocomplete="off">
            <label>Имя / Никнейм
              <input id="nickname" class="input" minlength="2" placeholder="Ваш ник">
            </label>
            <div class="profile-actions">
              <button class="btn btn--primary" type="submit">Сохранить</button>
              <button id="logout" class="btn btn--ghost" type="button">Выйти</button>
            </div>
          </form>

          <hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:12px 0" />

          <div class="section-title">Смена e-mail</div>
          <form id="form-email" class="grid-2" autocomplete="off">
            <label>Текущий e-mail
              <input id="email" class="input" type="email" readonly>
            </label>
            <label>Новый e-mail
              <input id="newEmail" class="input" type="email" placeholder="name@example.com">
            </label>
            <div class="profile-actions">
              <button class="btn" type="submit">Обновить e-mail</button>
            </div>
          </form>

          <div class="section-title">Смена пароля</div>
          <form id="form-pass" class="grid-2" autocomplete="off">
            <label>Новый пароль
              <input id="newPass" class="input" type="password" minlength="6" placeholder="••••••••">
            </label>
            <label>Повтор пароля
              <input id="newPass2" class="input" type="password" minlength="6" placeholder="••••••••">
            </label>
            <div class="profile-actions">
              <button class="btn" type="submit">Обновить пароль</button>
            </div>
          </form>

          <p id="msg" class="muted" style="padding:0 16px" aria-live="polite"></p>
        </section>
      </section>
    </main>
  </div>

  <script type="module">
    import { supa } from '/js/api.js';

    const $ = (id) => document.getElementById(id);
    const pad = (n) => n.toString().padStart(2,'0');
    const formatWhen = (date, time) => {
      if (!date && !time) return '—';
      const dt = new Date(`${date||''}T${time||'00:00'}`);
      if (isNaN(dt)) return '—';
      const d = dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
      const t = pad(dt.getHours())+':'+pad(dt.getMinutes());
      return `${d}${time ? ' в '+t : ''}`;
    };

    /* -------- tabs -------- */
    (function bindTabs(){
      const t1 = $('tab-events'), t2 = $('tab-account');
      const p1 = $('pane-events'), p2 = $('pane-account');
      const on = (which) => {
        const a = which==='events';
        t1.classList.toggle('is-active', a);  t1.setAttribute('aria-selected', a);
        t2.classList.toggle('is-active', !a); t2.setAttribute('aria-selected', !a);
        p1.classList.toggle('is-hidden', !a);
        p2.classList.toggle('is-hidden', a);
      };
      t1.addEventListener('click', ()=>on('events'));
      t2.addEventListener('click', ()=>on('account'));
    })();

    /* -------- auth/session -------- */
    let user = null;
    async function ensureUser() {
      const { data } = await supa.auth.getSession();
      user = data?.session?.user || null;
      if (!user) { location.href = '/'; return; }
      // заполнить email и ник
      $('email').value = user.email || '';
      const nick1 = user.user_metadata?.nickname || '';
      let nick = nick1;
      try {
        const { data: p } = await supa.from('profiles').select('nickname').eq('id', user.id).maybeSingle();
        if (p?.nickname) nick = nick || p.nickname;
      } catch {}
      $('nickname').value = nick || '';
    }

    /* -------- RSVP helpers -------- */
    async function fetchRsvps(eventId){
      try{
        const { data, error } = await supa
          .from('rsvps')
          .select('user_name,status')
          .eq('event_id', eventId)
          .order('created_at',{ascending:true});
        if (error) throw error;
        const groups = { yes:[], maybe:[], no:[] };
        (data||[]).forEach(r=>{
          const name = (r.user_name || 'Без имени').trim();
          const s = (r.status||'maybe').toLowerCase();
          (groups[s] || groups.maybe).push(name);
        });
        return groups;
      } catch(e){
        console.error('[profile] rsvps fetch', e);
        return { yes:[], maybe:[], no:[] };
      }
    }
    function makeRsvpPanel(eventId, groups){
      const wrap = document.createElement('div');
      wrap.className = 'glass-section rsvps-panel';
      wrap.dataset.for = String(eventId);
      wrap.innerHTML = `
        <div class="section-title">Кто идёт</div>
        <div class="stats">
          <span class="badge yes">Да: ${groups.yes.length}</span>
          <span class="badge maybe">Может быть: ${groups.maybe.length}</span>
          <span class="badge no">Нет: ${groups.no.length}</span>
        </div>
        <div class="guests-columns">
          <div>
            <div class="bubble-head">Да</div>
            <ul class="list">${groups.yes.map(n=>`<li>${n}</li>`).join('') || '<li>—</li>'}</ul>
          </div>
          <div>
            <div class="bubble-head">Может быть</div>
            <ul class="list">${groups.maybe.map(n=>`<li>${n}</li>`).join('') || '<li>—</li>'}</ul>
          </div>
          <div>
            <div class="bubble-head">Нет</div>
            <ul class="list">${groups.no.map(n=>`<li>${n}</li>`).join('') || '<li>—</li>'}</ul>
          </div>
        </div>
      `;
      return wrap;
    }

    // делегированный клик по кнопке «Гости»
    document.addEventListener('click', async (e)=>{
      const btn = e.target.closest('[data-action="show-rsvps"]');
      if (!btn) return;
      const card = btn.closest('.event-card');
      const eventId = Number(card?.dataset?.eventId);
      if (!eventId || !card) return;

      // если панель уже есть — просто сворачиваем/показываем
      let panel = card.nextElementSibling;
      if (panel && panel.classList.contains('rsvps-panel')) {
        panel.hidden = !panel.hidden;
        return;
      }

      // создаём заглушку, затем подменим
      panel = document.createElement('div');
      panel.className = 'glass-section rsvps-panel';
      panel.innerHTML = '<div class="section-title">Кто идёт</div><div class="hint">Загружаем…</div>';
      card.after(panel);

      const groups = await fetchRsvps(eventId);
      panel.replaceWith(makeRsvpPanel(eventId, groups));
    }, { passive:true });

    /* -------- load my events (owner + fallbacks) -------- */
    async function loadMyEvents() {
      const up = $('list-upcoming'); const past = $('list-past');
      up.innerHTML = ''; past.innerHTML = '';

      const bucket = { upcoming: [], past: [] };
      const pushToBucket = (arr=[]) => {
        const now = new Date();
        arr.forEach(ev => {
          const dt = (ev.date || ev.time) ? new Date(`${ev.date||''}T${ev.time||'00:00'}`) : null;
          const isPast = dt && !isNaN(dt) ? dt < now : false;
          (isPast ? bucket.past : bucket.upcoming).push(ev);
        });
      };

      const render = (list, box) => {
        if (!list.length) {
          const hint = document.createElement('div');
          hint.className = 'hint'; hint.textContent = 'Пусто.';
          box.appendChild(hint); return;
        }
        // сортировка (будущее вверх, прошлое — по убыванию)
        const toDate = (ev)=> new Date(`${ev.date||''}T${ev.time||'00:00'}`);
        const isUpcomingBox = box.id === 'list-upcoming';
        list.sort((a,b)=> isUpcomingBox ? (toDate(a)-toDate(b)) : (toDate(b)-toDate(a)));

        list.forEach(ev => {
          const li = document.createElement('div');
          li.className = 'event-card';
          li.dataset.eventId = String(ev.id);

          const meta = document.createElement('div'); meta.className = 'event-meta';
          const title = document.createElement('strong'); title.textContent = ev.title || 'Событие';
          const when  = document.createElement('span');   when.className = 'muted'; when.textContent = formatWhen(ev.date, ev.time);
          const code  = document.createElement('span');   code.className = 'chip mono'; code.textContent = ev.code || ev.join_code || '—';
          meta.append(title, when, code);

          const actions = document.createElement('div'); actions.className = 'profile-actions event-actions';
          const btnOpen = document.createElement('a'); btnOpen.className = 'btn btn--ghost btn--sm'; btnOpen.href = `/lobby.html?event=${ev.id}`; btnOpen.textContent = 'Открыть';
          const btnEdit = document.createElement('a'); btnEdit.className = 'btn btn--ghost btn--sm'; btnEdit.href = `/event-edit.html?event=${ev.id}`; btnEdit.textContent = 'Редактировать';
          const btnRsvps= document.createElement('button'); btnRsvps.className = 'btn btn--ghost btn--sm'; btnRsvps.type='button'; btnRsvps.textContent='Гости'; btnRsvps.setAttribute('data-action','show-rsvps');
          actions.append(btnOpen, btnEdit, btnRsvps);

          li.append(meta, actions);
          box.appendChild(li);
        });
      };

      try {
        // 1) Нормальный путь: ищем «мои» события по возможным полям владельца
        let q = supa.from('events')
          .select('id,title,code,join_code,date,time,owner_id,created_by,creator_id,creator_email')
          .order('date', { ascending: true })
          .order('time', { ascending: true })
          .limit(200);

        q = q.or([
          `owner_id.eq.${user.id}`,
          `created_by.eq.${user.id}`,
          `creator_id.eq.${user.id}`,
          `creator_email.eq.${user.email||''}`
        ].join(','));

        let { data: ownerEvents, error } = await q;
        if (error) ownerEvents = [];

        // 2) Фолбэк: из локальных следов (lastEventId / draftEvent)
        const fbIds = new Set(); const fbCodes = new Set();
        try { const lastId = localStorage.getItem('fh:lastEventId'); if (lastId) fbIds.add(Number(lastId)); } catch {}
        try {
          const draft = JSON.parse(sessionStorage.getItem('fh:draftEvent')||'null');
          if (draft?.id) fbIds.add(Number(draft.id));
          if (draft?.code) fbCodes.add(String(draft.code));
        } catch {}

        let fbEvents = [];
        if ((ownerEvents?.length||0) === 0 && (fbIds.size || fbCodes.size)) {
          if (fbIds.size) {
            const { data } = await supa.from('events')
              .select('id,title,code,join_code,date,time').in('id', Array.from(fbIds));
            fbEvents = fbEvents.concat(data||[]);
          }
          if (fbCodes.size) {
            for (const c of fbCodes) {
              const { data } = await supa.from('events')
                .select('id,title,code,join_code,date,time')
                .or(`code.eq.${c},join_code.eq.${c}`).limit(1);
              if (data && data[0]) fbEvents.push(data[0]);
            }
          }
        }

        // 3) Фолбэк по участию (если есть доступ к rsvps)
        let rsvpEvents = [];
        try {
          const myNick = (user.user_metadata?.nickname || '').trim();
          const { data: rsvps } = await supa.from('rsvps')
            .select('event_id,user_id,user_name')
            .or([
              `user_id.eq.${user.id}`,
              myNick ? `user_name.ilike.${myNick}` : 'user_name.eq.__none__'
            ].join(','))
            .limit(200);

          const ids = Array.from(new Set((rsvps||[]).map(r => r.event_id))).filter(Boolean);
          if (ids.length) {
            const { data } = await supa.from('events')
              .select('id,title,code,join_code,date,time')
              .in('id', ids).order('date', { ascending: true }).order('time', { ascending: true });
            rsvpEvents = data || [];
          }
        } catch { /* нет доступа — пропускаем */ }

        // Итог: объединяем по id и рисуем
        const merged = new Map();
        [...(ownerEvents||[]), ...fbEvents, ...rsvpEvents].forEach(ev => { if (ev) merged.set(ev.id, ev); });
        const mergedArr = Array.from(merged.values());
        const now = new Date();
        const upcoming = mergedArr.filter(ev => {
          const d = new Date(`${ev.date||''}T${ev.time||'00:00'}`);
          return d.toString() !== 'Invalid Date' ? d >= now : true;
        });
        const past = mergedArr.filter(ev => {
          const d = new Date(`${ev.date||''}T${ev.time||'00:00'}`);
          return d.toString() !== 'Invalid Date' ? d < now : false;
        });

        render(upcoming, up);
        render(past, past);
      } catch (e) {
        console.error('[profile] loadMyEvents', e);
        up.innerHTML = '<div class="hint">Не удалось загрузить события.</div>';
      }
    }

    /* -------- account forms -------- */
    $('form-nick').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const nickname = ($('nickname').value||'').trim();
      const msg = $('msg'); msg.textContent = 'Сохраняем…';
      try {
        const r1 = await supa.auth.updateUser({ data: { nickname } });
        if (r1.error) throw r1.error;
        try { await supa.from('profiles').upsert({ id: user.id, nickname }, { onConflict: 'id' }); } catch {}
        msg.textContent = 'Ник обновлён ✅';
        setTimeout(()=> msg.textContent = '',1500);
      } catch (e2) {
        msg.textContent = 'Ошибка: ' + (e2.message || e2);
      }
    });

    $('form-email').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const newEmail = ($('newEmail').value||'').trim();
      if (!newEmail) return;
      const msg = $('msg'); msg.textContent = 'Обновляем e-mail…';
      try {
        const { error } = await supa.auth.updateUser({ email: newEmail });
        if (error) throw error;
        msg.textContent = 'Письмо подтверждения отправлено на новый адрес. Проверьте почту.';
      } catch (e2) {
        msg.textContent = 'Ошибка: ' + (e2.message || e2);
      }
    });

    $('form-pass').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const p1 = ($('newPass').value||''); const p2 = ($('newPass2').value||'');
      const msg = $('msg');
      if (!p1 || p1.length < 6 || p1 !== p2) {
        msg.textContent = 'Пароль должен быть не короче 6 символов и совпадать.';
        return;
      }
      msg.textContent = 'Обновляем пароль…';
      try {
        const { error } = await supa.auth.updateUser({ password: p1 });
        if (error) throw error;
        msg.textContent = 'Пароль обновлён ✅';
      } catch (e2) {
        msg.textContent = 'Ошибка: ' + (e2.message || e2);
      }
    });

    $('logout')?.addEventListener('click', async ()=>{
      await supa.auth.signOut(); location.href = '/';
    });

    /* -------- boot -------- */
    await ensureUser();
    await loadMyEvents();
  </script>
</body>
</html>
