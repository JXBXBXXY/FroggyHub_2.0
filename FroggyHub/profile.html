<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Профиль — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding:2rem 1rem}

    /* topbar как на главной */
    .fh-header{display:flex;justify-content:flex-start;gap:12px;margin-bottom:16px}
    .topbar{
      display:flex;gap:8px;align-items:center;
      background:rgba(12,34,26,.55); border:1px solid rgba(255,255,255,.08);
      border-radius:999px; padding:6px; backdrop-filter:saturate(1.2) blur(10px);
      box-shadow:0 8px 24px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .topbar .btn{height:34px;line-height:32px;padding:0 12px}

    .profile-wrap{max-width:960px;margin:0 auto}
    .profile-card{padding:0}
    .profile-head{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.06)}
    .profile-actions{display:flex;gap:.5rem;justify-content:flex-end;padding:12px 16px}
    .tabs{display:flex;gap:6px;margin:0 16px 16px 16px}
    .tab{padding:.5rem .75rem;border-radius:999px;border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.04);cursor:pointer}
    .tab.is-active{background:rgba(255,255,255,.12)}
    .pane{padding:16px}
    .pane.is-hidden{display:none}

    .section-title{opacity:.9;margin:.75rem 0 .5rem;font-weight:700}
    .cards{display:grid;gap:10px}
    .event-card{display:flex;justify-content:space-between;align-items:center;
      padding:12px 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px}
    .event-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .muted{opacity:.85}
    .mono{font-variant-numeric:tabular-nums}
    .hint{opacity:.75}

    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:720px){ .grid-2{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="fh-bg" aria-hidden="true"></div>

  <div class="fh-content">
    <!-- TOPBAR -->
    <header class="fh-header">
      <nav class="topbar">
        <a href="/" class="btn btn--ghost btn--sm">FroggyHub</a>
        <a href="/index.html" class="btn btn--ghost btn--sm">Меню</a>
        <a href="/profile.html" class="btn btn--ghost btn--sm">Профиль</a>
        <a href="/settings.html" class="btn btn--ghost btn--sm">Настройки</a>
      </nav>
    </header>

    <main class="profile-wrap">
      <section class="card profile-card glass">
        <div class="profile-head">
          <h2 style="margin:0">Профиль</h2>
        </div>

        <!-- Вкладки -->
        <div class="tabs" role="tablist">
          <button class="tab is-active" id="tab-events"  aria-controls="pane-events"  aria-selected="true">События</button>
          <button class="tab"           id="tab-account" aria-controls="pane-account" aria-selected="false">Аккаунт</button>
        </div>

        <!-- Pane: События -->
        <section id="pane-events" class="pane" role="tabpanel" aria-labelledby="tab-events">
          <div class="section-title">Ближайшие</div>
          <div id="list-upcoming" class="cards"></div>

          <div class="section-title" style="margin-top:1rem">Прошедшие</div>
          <div id="list-past" class="cards"></div>
        </section>

        <!-- Pane: Аккаунт -->
        <section id="pane-account" class="pane is-hidden" role="tabpanel" aria-labelledby="tab-account">
          <form id="form-nick" class="grid-2" autocomplete="off">
            <label>Имя / Никнейм
              <input id="nickname" class="input" minlength="2" placeholder="Ваш ник">
            </label>
            <div class="profile-actions">
              <button class="btn btn--primary" type="submit">Сохранить</button>
              <button id="logout" class="btn btn--ghost" type="button">Выйти</button>
            </div>
          </form>

          <hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:12px 0" />

          <div class="section-title">Смена e-mail</div>
          <form id="form-email" class="grid-2" autocomplete="off">
            <label>Текущий e-mail
              <input id="email" class="input" type="email" readonly>
            </label>
            <label>Новый e-mail
              <input id="newEmail" class="input" type="email" placeholder="name@example.com">
            </label>
            <div class="profile-actions">
              <button class="btn" type="submit">Обновить e-mail</button>
            </div>
          </form>

          <div class="section-title">Смена пароля</div>
          <form id="form-pass" class="grid-2" autocomplete="off">
            <label>Новый пароль
              <input id="newPass" class="input" type="password" minlength="6" placeholder="••••••••">
            </label>
            <label>Повтор пароля
              <input id="newPass2" class="input" type="password" minlength="6" placeholder="••••••••">
            </label>
            <div class="profile-actions">
              <button class="btn" type="submit">Обновить пароль</button>
            </div>
          </form>

          <p id="msg" class="muted" style="padding:0 16px" aria-live="polite"></p>
        </section>
      </section>
    </main>
  </div>

  <script type="module">
    import { supa } from '/js/api.js';

    const $ = (id) => document.getElementById(id);
    const pad = (n) => n.toString().padStart(2,'0');
    const formatWhen = (date, time) => {
      if (!date && !time) return '—';
      const dt = new Date(`${date||''}T${time||'00:00'}`);
      if (isNaN(dt)) return '—';
      const d = dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
      const t = pad(dt.getHours())+':'+pad(dt.getMinutes());
      return `${d}${time ? ' в '+t : ''}`;
    };

    /* -------- tabs -------- */
    (function bindTabs(){
      const t1 = $('tab-events'), t2 = $('tab-account');
      const p1 = $('pane-events'), p2 = $('pane-account');
      const on = (which) => {
        const a = which==='events';
        t1.classList.toggle('is-active', a);  t1.setAttribute('aria-selected', a);
        t2.classList.toggle('is-active', !a); t2.setAttribute('aria-selected', !a);
        p1.classList.toggle('is-hidden', !a);
        p2.classList.toggle('is-hidden', a);
      };
      t1.addEventListener('click', ()=>on('events'));
      t2.addEventListener('click', ()=>on('account'));
    })();

    /* -------- auth/session -------- */
    let user = null;
    async function ensureUser() {
      const { data } = await supa.auth.getSession();
      user = data?.session?.user || null;
      if (!user) { location.href = '/'; return; }
      // заполнить email и ник
      $('email').value = user.email || '';
      const nick1 = user.user_metadata?.nickname || '';
      let nick = nick1;
      try {
        const { data: p } = await supa.from('profiles').select('nickname').eq('id', user.id).maybeSingle();
        if (p?.nickname) nick = nick || p.nickname;
      } catch {}
      $('nickname').value = nick || '';
    }

    /* -------- load my events (owner) -------- */
    async function loadMyEvents() {
      const up = $('list-upcoming'); const past = $('list-past');
      up.innerHTML = ''; past.innerHTML = '';
      try {
        // Пытаемся разными способами получить «мои» события
        // 1) owner_id
        let q = supa.from('events')
          .select('id, title, code, join_code, date, time')
          .order('date', { ascending: true })
          .order('time', { ascending: true })
          .limit(200);

        // Добавим фильтры по возможным полям создателя:
        q = q.or([
          `owner_id.eq.${user.id}`,
          `created_by.eq.${user.id}`,
          `creator_id.eq.${user.id}`,
          `creator_email.eq.${user.email||''}`
        ].join(','));

        const { data, error } = await q;
        if (error) throw error;

        const now = new Date();
        const bucket = { upcoming: [], past: [] };

        (data||[]).forEach(ev => {
          const dt = new Date(`${ev.date||''}T${ev.time||'00:00'}`);
          const isPast = isNaN(dt) ? false : (dt < now);
          (isPast ? bucket.past : bucket.upcoming).push(ev);
        });

        const render = (list, box) => {
          if (!list.length) {
            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.textContent = 'Пусто.';
            box.appendChild(hint);
            return;
          }
          list.forEach(ev => {
            const li = document.createElement('div');
            li.className = 'event-card';
            const meta = document.createElement('div');
            meta.className = 'event-meta';
            const title = document.createElement('strong');
            title.textContent = ev.title || 'Событие';
            const when = document.createElement('span');
            when.className = 'muted';
            when.textContent = formatWhen(ev.date, ev.time);
            const code = document.createElement('span');
            code.className = 'mono muted';
            code.textContent = ev.code || ev.join_code || '—';
            meta.append(title, when, code);

            const actions = document.createElement('div');
            actions.className = 'profile-actions';
            const btnOpen = document.createElement('a');
            btnOpen.className = 'btn btn--ghost btn--sm';
            btnOpen.href = `/lobby.html?event=${ev.id}`;
            btnOpen.textContent = 'Открыть';
            const btnEdit = document.createElement('a');
            btnEdit.className = 'btn btn--ghost btn--sm';
            btnEdit.href = `/event-edit.html?event=${ev.id}`;
            btnEdit.textContent = 'Редактировать';
            actions.append(btnOpen, btnEdit);

            li.append(meta, actions);
            box.appendChild(li);
          });
        };

        render(bucket.upcoming, up);
        render(bucket.past, past);
      } catch (e) {
        console.error('[profile] loadMyEvents', e);
        $('list-upcoming').innerHTML =
          '<div class="hint">Не удалось загрузить события.</div>';
      }
    }

    /* -------- account forms -------- */
    $('form-nick').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const nickname = ($('nickname').value||'').trim();
      const msg = $('msg'); msg.textContent = 'Сохраняем…';
      try {
        const r1 = await supa.auth.updateUser({ data: { nickname } });
        if (r1.error) throw r1.error;
        try { await supa.from('profiles').upsert({ id: user.id, nickname }, { onConflict: 'id' }); } catch {}
        msg.textContent = 'Ник обновлён ✅';
        setTimeout(()=> msg.textContent = '',1500);
      } catch (e2) {
        msg.textContent = 'Ошибка: ' + (e2.message || e2);
      }
    });

    $('form-email').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const newEmail = ($('newEmail').value||'').trim();
      if (!newEmail) return;
      const msg = $('msg'); msg.textContent = 'Обновляем e-mail…';
      try {
        const { error } = await supa.auth.updateUser({ email: newEmail });
        if (error) throw error;
        msg.textContent = 'Письмо подтверждения отправлено на новый адрес. Проверьте почту.';
      } catch (e2) {
        msg.textContent = 'Ошибка: ' + (e2.message || e2);
      }
    });

    $('form-pass').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const p1 = ($('newPass').value||''); const p2 = ($('newPass2').value||'');
      const msg = $('msg');
      if (!p1 || p1.length < 6 || p1 !== p2) {
        msg.textContent = 'Пароль должен быть не короче 6 символов и совпадать.';
        return;
      }
      msg.textContent = 'Обновляем пароль…';
      try {
        const { error } = await supa.auth.updateUser({ password: p1 });
        if (error) throw error;
        msg.textContent = 'Пароль обновлён ✅';
      } catch (e2) {
        msg.textContent = 'Ошибка: ' + (e2.message || e2);
      }
    });

    $('logout')?.addEventListener('click', async ()=>{
      await supa.auth.signOut(); location.href = '/';
    });

    /* -------- boot -------- */
    await ensureUser();
    await loadMyEvents();
  </script>
</body>
</html>
