<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Профиль — FroggyHub</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="guest">
  <header class="topbar" data-auth-only>
    <a href="#" class="logo" data-link="home">FroggyHub</a>
    <div class="topbar-right">
      <button data-link="menu">Меню</button>
      <button data-link="profile">Профиль</button>
      <button data-action="logout">Выйти</button>
    </div>
  </header>

  <main class="fh-content" data-auth-only>
    <div class="container">
      <div class="card">
        <h2>Профиль</h2>
        <div>Ник: <span id="profile-nickname"></span></div>
        <div>Email: <span id="profile-email"></span></div>
        <div>Создан: <span id="profile-created"></span></div>
      </div>
    </div>
  </main>

  <!-- Supabase client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Public env -->
  <script src="/env.js"></script>

  <!-- App -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
