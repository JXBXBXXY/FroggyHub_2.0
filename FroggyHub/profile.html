<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Профиль — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding-inline:1rem}
    .page{max-width:980px;margin:40px auto;display:grid;gap:24px;grid-template-columns:minmax(280px,1fr)}
    .muted{opacity:.85}
    .form-grid{display:grid;gap:12px}
    @media (min-width:720px){
      .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    }
  </style>
</head>
<body data-page="profile">
  <div class="fh-bg" aria-hidden="true"></div>

  <div class="fh-content">
    <!-- общий топбар как на финалке -->
    <header class="fh-header">
      <a class="fh-logo" href="/">FroggyHub</a>
      <nav class="topbar">
        <a href="/index.html" class="btn btn--ghost btn--sm">Меню</a>
        <a href="/profile.html" class="btn btn--ghost btn--sm is-active">Профиль</a>
        <a href="/wishlist.html" class="btn btn--ghost btn--sm">Редактировать wishlist</a>
      </nav>
    </header>

    <main class="page">
      <section class="glass">
        <h2>Профиль</h2>

        <div class="glass-section">
          <div class="section-title">Аккаунт</div>
          <form id="form" class="form-grid" autocomplete="off">
            <div class="form-2col">
              <label>E-mail
                <input id="email" class="input" type="email" readonly>
              </label>
              <label>Имя / Никнейм
                <input id="nickname" class="input" minlength="2" placeholder="Ваш ник">
              </label>
            </div>

            <div class="row end" style="gap:.5rem">
              <button id="save" class="btn btn--primary" type="submit">Сохранить</button>
              <button id="logout" class="btn btn--ghost" type="button">Выйти</button>
            </div>

            <p id="msg" class="muted" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { supa } from '/js/api.js';

    const $ = (id) => document.getElementById(id);
    const emailEl = $('email');
    const nickEl  = $('nickname');
    const msgEl   = $('msg');
    const form    = $('form');

    async function load() {
      msgEl.textContent = '';
      const { data: sess } = await supa.auth.getSession();
      const session = sess?.session;
      if (!session) { location.href = '/'; return; }

      const user = session.user;
      emailEl.value = user.email || '';
      nickEl.value  = (user.user_metadata?.nickname || '').trim();

      // подтянем из profiles, если есть
      try {
        const { data } = await supa
          .from('profiles')
          .select('nickname')
          .eq('id', user.id)
          .maybeSingle();
        if (data?.nickname && !nickEl.value) nickEl.value = data.nickname;
      } catch {}
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nickname = (nickEl.value || '').trim();
      if (nickname.length < 2) { nickEl.focus(); return; }

      msgEl.textContent = 'Сохраняем…';

      const { data: sess } = await supa.auth.getSession();
      const user = sess?.session?.user;
      if (!user) { location.href = '/'; return; }

      // 1) user_metadata
      const { error: authErr } = await supa.auth.updateUser({ data: { nickname } });
      if (authErr) { msgEl.textContent = 'Ошибка: ' + authErr.message; return; }

      // 2) sync в profiles (если RLS позволяет)
      try {
        await supa.from('profiles').upsert({ id: user.id, nickname }, { onConflict: 'id' });
      } catch {}

      msgEl.textContent = 'Готово ✅';
      setTimeout(()=> msgEl.textContent = '', 1500);
    });

    $('logout')?.addEventListener('click', async () => {
      try { await supa.auth.signOut(); } finally { location.href = '/'; }
    });

    load();
  </script>
</body>
</html>
