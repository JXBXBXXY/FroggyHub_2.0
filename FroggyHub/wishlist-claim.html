<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Выбор подарков — FroggyHub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <style>
    .fh-bg{position:fixed;inset:0;z-index:0;background:#0b241b url("/assets/froggy_glass_bg.jpeg") center 45%/cover no-repeat;}
    .fh-bg::after{content:"";position:absolute;inset:0;background:rgba(11,36,27,.55)}
    .fh-content{position:relative;z-index:20;min-height:100svh;padding:2rem 1rem;display:grid;place-items:start center}
    .box{max-width:900px;width:min(900px,100%);margin:0 auto}
    .wl{list-style:none;padding:0;margin:.75rem 0 0;display:grid;gap:.5rem}
    .li{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.75rem 1rem}
    .meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
    .title{font-weight:600}
    .badge{font-size:.85em;opacity:.85;padding:.2rem .6rem;border-radius:999px;border:1px solid rgba(255,255,255,.15)}
    .me{background:rgba(56,142,60,.15);border-color:rgba(56,142,60,.35)}
    .muted{opacity:.8}
    .hidden{display:none}
    .error{color:#ff8a80}
    .success{color:#a5d6a7}
  </style>
</head>
<body>
  <div class="fh-bg" aria-hidden="true"></div>
  <div class="fh-content">
    <main class="card box">
      <h1>Выбор подарков</h1>
      <p class="muted">
        Событие: <strong id="evName">—</strong> · Код: <strong id="evCode">—</strong><br/>
        Вы вошли как: <strong id="guestName">—</strong>
      </p>

      <h3>Wishlist</h3>
      <ul id="list" class="wl"></ul>
      <p id="empty" class="muted hidden">Вишлист пока пуст.</p>

      <div class="grid" style="grid-template-columns:1fr auto;gap:.75rem;margin-top:1rem">
        <a class="btn btn--ghost" id="backBtn" href="/index.html">В меню</a>
        <button class="btn btn--primary" id="toLobby">Готово → к лобби</button>
      </div>

      <p id="msgErr" class="error" role="status" aria-live="polite" style="margin-top:.5rem"></p>
      <p id="msgOk"  class="success hidden" role="status" aria-live="polite">Готово! Перенаправляю…</p>
    </main>
  </div>

  <script type="module">
    const $ = (id)=>document.getElementById(id);
    const qs   = new URLSearchParams(location.search);
    const code = (qs.get('code')||'').trim();
    const my   = (qs.get('name')||'').trim();

    $('evCode').textContent   = code || '—';
    $('guestName').textContent= my || '—';

    const same = (a='',b='') => a.trim().toLowerCase() === b.trim().toLowerCase();

    let eventRow = null;
    let items    = [];

    $('toLobby').addEventListener('click', ()=>{
      $('msgOk').classList.remove('hidden');
      const target = eventRow?.code || eventRow?.join_code || code;
      setTimeout(()=> location.href = `/lobby.html?code=${encodeURIComponent(target)}`, 350);
    });

    function btnBusy(b){
      $('toLobby').disabled = b;
      document.querySelectorAll('.wl button').forEach(x=> x.disabled = b);
    }

    async function j(url, opts){
      const r = await fetch(url, opts);
      const data = await r.json().catch(()=> ({}));
      return { ok: r.ok, data };
    }

    function idOf(i){ return i.id || i.item_id || i.itemId; }
    function titleOf(i){ return i.title || i.name || 'Без названия'; }
    function urlOf(i){ return i.url || i.link || ''; }
    function claimerOf(i){ return i.claimed_by ?? i.claimedBy ?? i.claimed ?? null; }

    function render(){
      const ul = $('list'); ul.innerHTML = '';
      if (!Array.isArray(items) || items.length === 0){
        $('empty').classList.remove('hidden'); return;
      }
      $('empty').classList.add('hidden');

      items.forEach(it=>{
        const li = document.createElement('li'); li.className = 'li';
        const meta = document.createElement('div'); meta.className = 'meta';

        const t = document.createElement('span'); t.className='title';
        const link = urlOf(it);
        if (link) t.innerHTML = `<a href="${link}" target="_blank" rel="noopener">${titleOf(it)}</a>`;
        else t.textContent = titleOf(it);
        meta.appendChild(t);

        const claimer = claimerOf(it);
        if (claimer){
          const b = document.createElement('span');
          b.className = 'badge ' + (same(claimer,my) ? 'me' : '');
          b.textContent = same(claimer,my) ? 'Ваш выбор' : `Занято: ${claimer}`;
          meta.appendChild(b);
        } else {
          const b = document.createElement('span');
          b.className = 'badge';
          b.textContent = 'Свободно';
          meta.appendChild(b);
        }

        li.appendChild(meta);

        const btn = document.createElement('button');
        btn.className = 'btn btn--ghost btn--sm';

        if (!claimer){
          btn.textContent = 'Забрать';
          btn.disabled = !my;
          btn.addEventListener('click', ()=> claim(idOf(it)));
        } else if (same(claimer,my)){
          btn.textContent = 'Отменить';
          btn.addEventListener('click', ()=> unclaim(idOf(it)));
        } else {
          btn.textContent = 'Недоступно';
          btn.disabled = true;
        }

        li.appendChild(btn);
        ul.appendChild(li);
      });
    }

    async function claim(itemId){
      $('msgErr').textContent = ''; btnBusy(true);
      const body = { code, guest_name: my, claimItemId: itemId };
      const r = await j('/.netlify/functions/events-rsvp', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      if (!r.ok || r.data?.error){
        $('msgErr').textContent = r.data?.error || 'Не удалось занять предмет.';
      } else {
        items = items.map(x=> idOf(x)===itemId ? { ...x, claimed_by: my } : x);
        render();
      }
      btnBusy(false);
    }

    async function unclaim(itemId){
      $('msgErr').textContent = ''; btnBusy(true);
      const body = { code, guest_name: my, unclaimItemId: itemId };
      const r = await j('/.netlify/functions/events-rsvp', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      if (!r.ok || r.data?.error){
        $('msgErr').textContent = r.data?.error || 'Не удалось снять бронь.';
      } else {
        items = items.map(x=> idOf(x)===itemId ? { ...x, claimed_by: null } : x);
        render();
      }
      btnBusy(false);
    }

    async function loadAll(){
      if (!/^\d{6}$/.test(code)){ $('msgErr').textContent = 'Некорректный код события.'; return; }
      if (!my){ $('msgErr').textContent = 'Не передано имя гостя.'; return; }

      // 1) Пытаемся расширенный API, где уже есть вишлист
      let r = await j('/.netlify/functions/events-one-v2?code=' + encodeURIComponent(code));
      if (!r.ok) r = await j('/.netlify/functions/events-one?code=' + encodeURIComponent(code));

      if (r.ok){
        const root = r.data.event || r.data || {};
        eventRow = root.event || root;
        $('evName').textContent = eventRow.title || 'Событие';
        items = r.data.wishlist_items || r.data.wishlist || eventRow.wishlist_items || [];
        if (Array.isArray(items) && items.length){ render(); return; }
      }

      // 2) Фоллбек: минимальный event + попытка получить список по нескольким функциям
      const g = await j('/.netlify/functions/events-get?code=' + encodeURIComponent(code));
      if (!g.ok){ $('msgErr').textContent = g.data?.error || 'Событие не найдено.'; return; }
      eventRow = g.data; $('evName').textContent = eventRow.title || 'Событие';

      const bases = [
        '/.netlify/functions/wishlist-list?event_id=',
        '/.netlify/functions/wishlist?event_id=',
        '/.netlify/functions/events-list?event_id='
      ];
      for (const b of bases){
        const w = await j(b + encodeURIComponent(eventRow.id));
        if (w.ok && Array.isArray(w.data)){ items = w.data; break; }
        if (w.ok && Array.isArray(w.data?.items)){ items = w.data.items; break; }
      }
      render();
    }

    loadAll();
  </script>
</body>
</html>
