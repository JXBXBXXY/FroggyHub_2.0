<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Редактирование события</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="container" role="main">
    <form id="editForm" class="card grid edit-form" aria-describedby="editError">
      <h1>Редактировать событие</h1>
      <label>Название
        <input id="editTitle" required aria-required="true" />
      </label>
      <label>Дата
        <input id="editDate" type="date" required aria-required="true" />
      </label>
      <label>Время
        <input id="editTime" type="time" required aria-required="true" />
      </label>
      <label>Адрес
        <input id="editAddress" />
      </label>
      <label>Заметки
        <textarea id="editNotes"></textarea>
      </label>
      <label>Дресс-код
        <input id="editDress" />
      </label>
      <label>Что взять
        <input id="editBring" />
      </label>
      <div class="save-row">
        <button id="saveEvent" type="submit" class="btn btn--primary">Сохранить</button>
      </div>
    </form>
    <p id="editError" class="error" role="status" aria-live="polite"></p>
  </main>

  <!-- Небольшой инлайновый модуль: сохраняем черновик и ведём на wishlist.html -->
  <script type="module">
    const form = document.getElementById('editForm');
    const $ = (id) => document.getElementById(id);

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const draft = {
        title:   $('editTitle').value.trim(),
        date:    $('editDate').value,
        time:    $('editTime').value,
        address: $('editAddress').value.trim(),
        notes:   $('editNotes').value.trim(),
        dress:   $('editDress').value.trim(),
        bring:   $('editBring').value.trim(),
      };

      try {
        sessionStorage.setItem('fh:draftEvent', JSON.stringify(draft));
      } catch {}

      // дальше — отдельная страница Wishlist
      location.href = '/wishlist.html';
    });
  </script>
</body>
</html>
