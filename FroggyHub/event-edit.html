<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Редактирование события</title>
<link rel="stylesheet" href="/style.css?v=5">
</head>
<body class="guest">
  <div id="fh-message-clouds" aria-hidden="true"></div>
  <header class="topbar" data-auth-only>
    <a href="#" class="logo" data-link="home">FroggyHub</a>
    <div class="topbar-right">
      <button data-link="menu">Меню</button>
      <button data-link="profile">Профиль</button>
      <button data-action="logout">Выйти</button>
    </div>
  </header>

  <main class="container" role="main" data-auth-only>
    <form id="editForm" class="card grid edit-form" aria-describedby="editError">
      <h1>Редактировать событие</h1>

      <label>Название
        <input id="editTitle" name="title" required aria-required="true" />
      </label>

      <label>Дата
        <input id="editDate" name="date" type="date" required aria-required="true" />
      </label>

      <label>Время
        <input id="editTime" name="time" type="time" required aria-required="true" />
      </label>

      <label>Адрес
        <input id="editAddress" name="address" />
      </label>

      <label>Заметки
        <textarea id="editNotes" name="notes"></textarea>
      </label>

      <label>Дресс-код
        <input id="editDress" name="dress" />
      </label>

      <label>Что взять
        <input id="editBring" name="bring" />
      </label>

      <div class="save-row">
        <button id="saveEvent" type="submit" class="btn btn--primary">Сохранить</button>
      </div>
    </form>

    <p id="editError" class="error" role="status" aria-live="polite"></p>
  </main>

  <div id="cookieCard" class="card" style="display:none" data-auth-only>
    <svg id="cookieSvg" viewBox="0 0 24 24" aria-hidden="true">
      <g><path d="M12 2a5 5 0 0 0 5 5 5 5 0 0 0 5 5 10 10 0 1 1-10-10z"/></g>
    </svg>
    <div class="cookieHeading">Cookies</div>
    <div class="cookieDescription">
      Мы используем файлы cookies, чтобы сайт работал быстрее и удобнее. Продолжая, вы соглашаетесь с их использованием.
    </div>
    <div class="buttonContainer">
      <button class="btn btn--primary acceptButton" id="cookieAccept">Ок</button>
      <button class="btn btn--ghost declineButton" id="cookieDecline">Только необходимые</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden data-auth-only></div>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Public env -->
  <script src="env.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js"></script>

  <script>
    // чтобы переходить к следующему шагу (wishlist)
    document.getElementById('editForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      // app.js обработает сохранение → после удачи редирект
      // если app.js ещё не обновлён — временный переход:
      // window.location.href = "wishlist-setup.html";
    });
  </script>
</body>
</html>
