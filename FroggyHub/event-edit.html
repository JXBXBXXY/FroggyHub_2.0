<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Редактирование события</title>

  <!-- общий стиль -->
  <link rel="stylesheet" href="style.css" />

  <!-- favicon -->
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='.9em' font-size='96'%3E🐸%3C/text%3E%3C/svg%3E">
  <meta name="format-detection" content="telephone=no" />
</head>
<body class="scene-intro" data-page="event-edit">
  <!-- фон как на других страницах -->
  <div class="fh-bg" aria-hidden="true"></div>

  <!-- единый topbar -->
  <nav class="topbar">
    <a href="/" class="logo">FroggyHub</a>
    <div class="topbar-right">
      <a class="btn btn-sm btn-ghost" href="/index.html">Главная</a>
      <a class="btn btn-sm btn-ghost" href="/profile.html">Профиль</a>
    </div>
  </nav>

  <!-- основной контент -->
  <main class="container final-wrap" role="main">
    <form id="editForm" class="final-card grid edit-form" aria-describedby="editError">
      <h1 class="title">Редактировать событие</h1>

      <label>Название
        <input id="editTitle" required aria-required="true" />
      </label>

      <label>Дата
        <input id="editDate" type="date" required aria-required="true" />
      </label>

      <label>Время
        <input id="editTime" type="time" required aria-required="true" />
      </label>

      <label>Адрес
        <input id="editAddress" />
      </label>

      <label>Заметки
        <textarea id="editNotes"></textarea>
      </label>

      <label>Дресс-код
        <input id="editDress" />
      </label>

      <label>Что взять
        <input id="editBring" />
      </label>

      <div class="save-row">
        <button id="saveEvent" type="submit" class="btn btn--primary">Сохранить</button>
      </div>
    </form>

    <p id="editError" class="error" role="status" aria-live="polite"></p>
  </main>

  <!-- твой скрипт сохранён -->
  <script type="module">
    const form = document.getElementById('editForm');
    const $ = (id) => document.getElementById(id);

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const draft = {
        title:   $('editTitle').value.trim(),
        date:    $('editDate').value,
        time:    $('editTime').value,
        address: $('editAddress').value.trim(),
        notes:   $('editNotes').value.trim(),
        dress:   $('editDress').value.trim(),
        bring:   $('editBring').value.trim(),
      };

      try { sessionStorage.setItem('fh:draftEvent', JSON.stringify(draft)); } catch {}
      location.href = '/wishlist.html';
    });
  </script>

  <!-- общий JS (но без пузырей) -->
  <script type="module" src="/js/app.js"></script>

  <!-- локальная косметика -->
  <style>
    #editForm label { display: grid; gap: 6px; }
    #editForm input, #editForm textarea { width: 100%; }
    #editForm textarea { min-height: 88px; resize: vertical; }
    .final-card h1.title { margin-top: 0; margin-bottom: 12px; }
    @media (max-width:640px){
      #editForm { padding: 14px; border-radius: 14px; }
    }
  </style>
</body>
</html>
