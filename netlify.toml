[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SUPABASE_URL = "..."
  SUPABASE_SERVICE_ROLE_KEY = "..."
  DEBUG_ANALYTICS = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg","bcryptjs","jsonwebtoken"]

[functions."sync-secondary"]
  schedule = "@hourly"
